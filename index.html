<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Diagramas de Mollier (p-h) Pro - Mediciones y Diagnóstico de Campo</title>
  
  <!-- CDNs necesarios: Plotly para la gráfica y html2pdf para generar el PDF -->
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow-x: hidden;
      overflow-y: auto;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 100vw;
      min-height: 100dvh;
      padding: 4px;
      gap: 4px;
      overflow-x: hidden;
    }

    /* Barra superior con hora activa y clima */
    .top-info-bar {
      background: #1e293b;
      border: 1px solid #38bdf8;
      border-radius: 6px;
      padding: 3px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.70rem;
      color: #38bdf8;
      font-weight: bold;
    }

    .top-info-bar .date-time-box {
      color: #f8fafc;
      font-size: 0.68rem;
    }

    /* Formulario compacto de identificación profesional */
    .prof-header-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 4px 6px;
    }

    .prof-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 3px;
    }

    .prof-grid .input-group {
      display: flex;
      flex-direction: column;
    }

    .prof-grid label {
      font-size: 0.52rem;
      color: #38bdf8;
      font-weight: bold;
      margin-bottom: 1px;
      white-space: nowrap;
    }

    .prof-grid input, .prof-grid select {
      padding: 2px 4px;
      border: 1px solid #475569;
      border-radius: 4px;
      font-size: 0.68rem;
      background-color: #0f172a;
      color: #f8fafc;
      height: 22px;
    }

    .top-panel {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 4px;
      flex-shrink: 0;
      width: 100%;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 4px 6px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      width: 100%;
    }

    .card h2 {
      font-size: 0.72rem;
      text-transform: uppercase;
      color: #38bdf8;
      margin-bottom: 3px;
      letter-spacing: 0.5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .config-row {
      display: flex;
      gap: 4px;
      margin-bottom: 3px;
      width: 100%;
    }

    .config-row .input-group-ref { flex: 1.8; min-width: 0; }
    .config-row .input-group-cap { flex: 1.5; min-width: 0; }
    .config-row .input-group-unit { flex: 1; min-width: 0; }

    .controls-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 3px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      border-radius: 4px;
      padding: 1px;
    }

    .input-group label {
      font-size: 0.55rem;
      font-weight: 600;
      margin-bottom: 1px;
      color: #94a3b8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .input-group input, .input-group select {
      padding: 2px 4px;
      border: 1px solid #475569;
      border-radius: 4px;
      font-size: 0.72rem;
      outline: none;
      background-color: #0f172a;
      color: #f8fafc;
      width: 100%;
      height: 24px;
    }

    .input-group select {
      cursor: pointer;
      border-color: #38bdf8;
      font-weight: 600;
    }

    .input-group select optgroup {
      background-color: #1e293b;
      color: #38bdf8;
      font-weight: bold;
    }

    .input-group select option {
      background-color: #0f172a;
      color: #f8fafc;
    }

    .action-bar {
      display: flex;
      gap: 4px;
      margin-bottom: 3px;
      width: 100%;
      flex-shrink: 0;
    }

    .btn {
      flex: 1;
      padding: 3px 6px;
      border: none;
      border-radius: 4px;
      font-size: 0.68rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      height: 26px;
    }

    .btn-reporte {
      background-color: #10b981;
      color: #ffffff;
    }
    .btn-reporte:hover {
      background-color: #059669;
    }

    .btn-toggle { background-color: #334155; color: #cbd5e1; }
    .btn-toggle.active {
      background-color: #0284c7;
      color: #ffffff;
      box-shadow: 0 0 6px rgba(2, 132, 199, 0.4);
    }

    .results-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 3px;
      margin-bottom: 4px;
    }

    .kpi-box {
      background-color: #0f172a;
      border-left: 3px solid #38bdf8;
      padding: 2px 3px;
      border-radius: 4px;
    }

    .kpi-box .label {
      font-size: 0.50rem;
      color: #94a3b8;
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .kpi-box .value {
      font-size: 0.68rem;
      font-weight: 700;
      color: #f8fafc;
    }

    .diag-container {
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 4px 6px;
      width: 100%;
    }

    .diag-item {
      font-size: 0.62rem;
      margin-bottom: 2px;
      line-height: 1.2;
      display: flex;
      align-items: flex-start;
      gap: 4px;
      text-align: justify;
    }

    .diag-item:last-child {
      margin-bottom: 0;
    }

    .chart-card {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 100vw;
      padding: 2px;
      overflow: hidden;
      box-sizing: border-box;
    }

    .chart-container {
      width: 100%;
      max-width: 100%;
      height: 320px;
      overflow: hidden;
    }

    .alarm-field-active {
      animation: blink-field 0.8s infinite alternate !important;
      border-radius: 6px;
      padding: 2px 4px !important;
    }

    .alarm-field-active input {
      background-color: #7f1d1d !important;
      color: #ffffff !important;
      border-color: #ef4444 !important;
      font-weight: bold;
    }

    .alarm-field-active label {
      color: #fca5a5 !important;
      font-weight: bold;
    }

    @keyframes blink-field {
      0% {
        background-color: rgba(239, 68, 68, 0.9);
        box-shadow: 0 0 10px rgba(239, 68, 68, 0.8);
      }
      100% {
        background-color: rgba(127, 29, 29, 0.3);
        box-shadow: 0 0 2px rgba(239, 68, 68, 0.2);
      }
    }

    body.generating-pdf {
      background-color: #ffffff !important;
      color: #000000 !important;
    }
    body.generating-pdf .card, 
    body.generating-pdf .prof-header-card, 
    body.generating-pdf .top-info-bar,
    body.generating-pdf .diag-container,
    body.generating-pdf .kpi-box {
      background-color: #ffffff !important;
      border-color: #cccccc !important;
      color: #000000 !important;
    }
    body.generating-pdf input, 
    body.generating-pdf select {
      background-color: #ffffff !important;
      color: #000000 !important;
      border-color: #999999 !important;
    }
    body.generating-pdf .action-bar {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="app-container" id="reporteArea">
    
    <!-- Barra superior con Fecha, Hora Activa y Clima -->
    <div class="top-info-bar">
      <div class="date-time-box">
        📅 <span id="txtFechaHora">Cargando fecha y hora...</span>
      </div>
      <div>
        📍 Punto Fijo: <span id="txtTempAmb">Cargando...</span>
      </div>
    </div>

    <!-- Identificación Profesional y Datos del Equipo -->
    <div class="prof-header-card">
      <div class="prof-grid">
        <div class="input-group">
          <label for="empresaNombre">Empresa</label>
          <input type="text" id="empresaNombre" value="Servicios Técnicos" oninput="guardarYActualizar()">
        </div>

        <div class="input-group">
          <label for="empresaRif">RIF / ID Fiscal</label>
          <input type="text" id="empresaRif" value="J-00000000-0" oninput="guardarYActualizar()">
        </div>

        <div class="input-group">
          <label for="tecnicoNombre">Técnico Evaluante</label>
          <input type="text" id="tecnicoNombre" value="Téc. Especialista" oninput="guardarYActualizar()">
        </div>

        <div class="input-group">
          <label for="equipoMarca">Marca del Equipo</label>
          <input type="text" id="equipoMarca" value="Daikin" oninput="guardarYActualizar()">
        </div>

        <div class="input-group">
          <label for="equipoModelo">Modelo</label>
          <input type="text" id="equipoModelo" value="XL10-2026" oninput="guardarYActualizar()">
        </div>

        <div class="input-group">
          <label for="capFrigNominal">Cap. Frigorífica (BTU/h / Ton)</label>
          <input type="text" id="capFrigNominal" value="36,000 BTU/h (3 Ton)" oninput="guardarYActualizar()">
        </div>
      </div>
    </div>

    <header class="top-panel">
      <div class="card" id="cardDatosCampo">
        <h2><span>Datos de Campo</span></h2>
        
        <div class="config-row">
          <div class="input-group input-group-ref">
            <label for="refSelect">Refrigerante</label>
            <select id="refSelect" onchange="guardarYActualizar()">
              <optgroup label="Puros y Tradicionales">
                <option value="R134a">R-134a</option>
                <option value="R22">R-22</option>
                <option value="R410A">R-410A</option>
                <option value="R32">R-32</option>
              </optgroup>
              <optgroup label="Hidrocarburos (HC)">
                <option value="R290">R-290 (Propano)</option>
                <option value="R600a">R-600a (Isobutano)</option>
              </optgroup>
              <optgroup label="Mezclas HFC (Serie 400 / 500)">
                <option value="R404A" selected>R-404A</option>
                <option value="R507A">R-507A</option>
                <option value="R407C">R-407C</option>
              </optgroup>
            </select>
          </div>

          <!-- Selector compacto y discreto de Capacidad Frigorífica al lado del tag -->
          <div class="input-group input-group-cap">
            <label for="capPresetSelect">Cap. Rápida</label>
            <select id="capPresetSelect" onchange="seleccionarCapacidadRapida(this.value)">
              <option value="custom">Personalizada</option>
              <option value="9000">9,000 BTU (0.75 Ton)</option>
              <option value="12000">12,000 BTU (1.0 Ton)</option>
              <option value="18000">18,000 BTU (1.5 Ton)</option>
              <option value="24000">24,000 BTU (2.0 Ton)</option>
              <option value="36000" selected>36,000 BTU (3.0 Ton)</option>
              <option value="48000">48,000 BTU (4.0 Ton)</option>
              <option value="60000">60,000 BTU (5.0 Ton)</option>
            </select>
          </div>

          <div class="input-group input-group-unit">
            <label for="pUnitSelect">U. Presión</label>
            <select id="pUnitSelect" onchange="cambiarUnidades()">
              <option value="psi" selected>PSI</option>
              <option value="bar">Bar</option>
              <option value="kpa">kPa</option>
            </select>
          </div>

          <div class="input-group input-group-unit">
            <label for="tUnitSelect">U. Temp</label>
            <select id="tUnitSelect" onchange="cambiarUnidades()">
              <option value="C" selected>°C</option>
              <option value="F">°F</option>
            </select>
          </div>
        </div>

        <div class="controls-grid">
          <div class="input-group" id="grpPSuct">
            <label for="pSuct" id="lblPSuct">P. Succión</label>
            <input type="number" id="pSuct" value="25" step="1" oninput="guardarYActualizar()">
          </div>

          <div class="input-group" id="grpPDesc">
            <label for="pDesc" id="lblPDesc">P. Descarga</label>
            <input type="number" id="pDesc" value="290" step="1" oninput="guardarYActualizar()">
          </div>

          <div class="input-group" id="grpTEvapOut">
            <label for="tEvapOut" id="lblTEvapOut">T. Salida Evap</label>
            <input type="number" id="tEvapOut" value="-12" step="0.5" oninput="guardarYActualizar()">
          </div>

          <div class="input-group" id="grpTSuct">
            <label for="tSuct" id="lblTSuct">T. Temp Succión</label>
            <input type="number" id="tSuct" value="-10" step="0.5" oninput="guardarYActualizar()">
          </div>

          <div class="input-group" id="grpTLiq">
            <label for="tLiq" id="lblTLiq">T. Tubería Liq</label>
            <input type="number" id="tLiq" value="45" step="0.5" oninput="guardarYActualizar()">
          </div>

          <div class="input-group" id="grpTDescReal">
            <label for="tDescReal" id="lblTDescReal">T. Descarga</label>
            <input type="number" id="tDescReal" value="90" step="1" oninput="guardarYActualizar()">
          </div>

          <div class="input-group">
            <label for="vVolt">Voltaje (V)</label>
            <input type="number" id="vVolt" value="220" step="1" oninput="guardarYActualizar()">
          </div>

          <div class="input-group">
            <label for="iAmp">Amperaje (A)</label>
            <input type="number" id="iAmp" value="22" step="0.1" oninput="guardarYActualizar()">
          </div>
        </div>

      </div>

      <div class="card" id="cardIndicadores">
        <h2>Indicadores y Diagnóstico</h2>
        <div class="results-grid">
          <div class="kpi-box" style="border-left-color: #38bdf8;">
            <span class="label">SH Útil (Evap)</span>
            <span class="value" id="kpiSHUtil">0.0 K</span>
          </div>
          <div class="kpi-box" style="border-left-color: #0284c7;">
            <span class="label">SH Total (Succ)</span>
            <span class="value" id="kpiSHTotal">0.0 K</span>
          </div>
          <div class="kpi-box" style="border-left-color: #10b981;">
            <span class="label">Subenfriam. (SC)</span>
            <span class="value" id="kpiSC">0.0 K</span>
          </div>
          <div class="kpi-box" style="border-left-color: #f59e0b;">
            <span class="label">Potencia Elec.</span>
            <span class="value" id="kpiKW">0.00 kW</span>
          </div>
          <div class="kpi-box" style="border-left-color: #a855f7;">
            <span class="label">Cap. Frig. (qn)</span>
            <span class="value" id="kpiqn">0 kJ/kg</span>
          </div>
          <div class="kpi-box" style="border-left-color: #ef4444;">
            <span class="label">Trabajo Comp (w)</span>
            <span class="value" id="kpiw">0 kJ/kg</span>
          </div>
          <div class="kpi-box" style="border-left-color: #ec4899;">
            <span class="label">COP Estimado</span>
            <span class="value" id="kpicop">0.0</span>
          </div>
          <div class="kpi-box" style="border-left-color: #64748b;">
            <span class="label">ΔT Cond - Amb</span>
            <span class="value" id="kpiDeltaAmb">0.0 K</span>
          </div>
        </div>

        <div class="diag-container" id="panelAlertas">
        </div>
      </div>

    </header>

    <main class="card chart-card">
      <div class="action-bar">
        <button class="btn btn-toggle" id="btnZonaActiva" onclick="toggleZonaActiva()">
          🔍 Zoom Zona Activa: OFF
        </button>
        <button class="btn btn-toggle active" id="btnPuntosIntermedios" onclick="togglePuntosIntermedios()">
          📍 Puntos Intermedios: ON
        </button>
        <!-- Botón verde de reporte -->
        <button class="btn btn-reporte" onclick="descargarPDFReporte()">
          📄 Reporte
        </button>
      </div>

      <div id="mollierPlot" class="chart-container"></div>
    </main>

  </div>

    function seleccionarCapacidadRapida(val) {
      const inputCap = document.getElementById('capFrigNominal');
      if (val === 'custom') return;
      const btu = parseInt(val, 10);
      const ton = (btu / 12000).toFixed(btu % 12000 === 0 ? 1 : 2);
      inputCap.value = `${btu.toLocaleString()} BTU/h (${ton} Ton)`;
      guardarYActualizar();
    }

    function actualizarReloj() {
      const ahora = new Date();
      const opciones = { 
        year: 'numeric', month: '2-digit', day: '2-digit', 
        hour: '2-digit', minute: '2-digit', second: '2-digit', 
        hour12: true 
      };
      document.getElementById('txtFechaHora').innerText = ahora.toLocaleString('es-VE', opciones);
    }

    function convertirTemp(tempC) {
      return (tUnitActual === 'F') ? (tempC * 9/5) + 32 : tempC;
    }

    async function obtenerClimaPuntoFijo() {
      const lbl = document.getElementById('txtTempAmb');
      try {
        const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=11.7&longitude=-70.2&current_weather=true');
        const data = await res.json();
        if (data && data.current_weather) {
          tempAmbientePuntoFijoC = data.current_weather.temperature;
          let tempMostrar = convertirTemp(tempAmbientePuntoFijoC);
          lbl.innerText = `${tempMostrar.toFixed(1)} °${tUnitActual}`;
          guardarYActualizar();
        } else {
          lbl.innerText = "30.0 °C";
        }
      } catch (e) {
        lbl.innerText = "30.0 °C";
      }
    }

    function actualizarEtiquetas() {
      document.getElementById('lblPSuct').innerText = `P. Succión (${pUnits[pUnitActual].label})`;
      document.getElementById('lblPDesc').innerText = `P. Descarga (${pUnits[pUnitActual].label})`;
      document.getElementById('lblTEvapOut').innerText = `T. Salida Evap (°${tUnitActual})`;
      document.getElementById('lblTSuct').innerText = `T. Succ Tubo (°${tUnitActual})`;
      document.getElementById('lblTLiq').innerText = `T. Tubería Liq (°${tUnitActual})`;
      document.getElementById('lblTDescReal').innerText = `T. Descarga (°${tUnitActual})`;
    }

    function cambiarUnidades() {
      pUnitActual = document.getElementById('pUnitSelect').value;
      tUnitActual = document.getElementById('tUnitSelect').value;
      actualizarEtiquetas();
      obtenerClimaPuntoFijo();
      guardarYActualizar();
    }

    function toggleZonaActiva() {
      zonaActivaHabilitada = !zonaActivaHabilitada;
      const btn = document.getElementById('btnZonaActiva');
      if (zonaActivaHabilitada) {
        btn.classList.add('active');
        btn.innerText = '🔍 Zoom Zona Activa: ON';
      } else {
        btn.classList.remove('active');
        btn.innerText = '🔍 Zoom Zona Activa: OFF';
      }
      guardarYActualizar();
    }

    function togglePuntosIntermedios() {
      mostrarPuntosIntermedios = !mostrarPuntosIntermedios;
      const btn = document.getElementById('btnPuntosIntermedios');
      if (mostrarPuntosIntermedios) {
        btn.classList.add('active');
        btn.innerText = '📍 Puntos Intermedios: ON';
      } else {
        btn.classList.remove('active');
        btn.innerText = '📍 Puntos Intermedios: OFF';
      }
      guardarYActualizar();
    }

    function interpolarDomo(pAbsBar, ref) {
      const dome = ref.dome;
      if (pAbsBar <= dome[0].p) return dome[0];
      if (pAbsBar >= dome[dome.length - 1].p) return dome[dome.length - 1];
      for (let i = 0; i < dome.length - 1; i++) {
        if (pAbsBar >= dome[i].p && pAbsBar <= dome[i+1].p) {
          const factor = (pAbsBar - dome[i].p) / (dome[i+1].p - dome[i].p);
          return {
            p: pAbsBar,
            hL: dome[i].hL + factor * (dome[i+1].hL - dome[i].hL),
            hV: dome[i].hV + factor * (dome[i+1].hV - dome[i].hV),
            tSat: dome[i].tSat + factor * (dome[i+1].tSat - dome[i].tSat)
          };
        }
      }
      return dome[0];
    }

    function guardarYActualizar() {
      const refKey = document.getElementById('refSelect').value;
      const ref = refrigerantes[refKey] || refrigerantes.R404A;

      let pSuctVal = parseFloat(document.getElementById('pSuct').value) || 0;
      let pDescVal = parseFloat(document.getElementById('pDesc').value) || 0;
      let tEvapOutVal = parseFloat(document.getElementById('tEvapOut').value) || 0;
      let tSuctVal = parseFloat(document.getElementById('tSuct').value) || 0;
      let tLiqVal = parseFloat(document.getElementById('tLiq').value) || 0;
      let tDescRealVal = parseFloat(document.getElementById('tDescReal').value) || 0;
      let vVoltVal = parseFloat(document.getElementById('vVolt').value) || 0;
      let iAmpVal = parseFloat(document.getElementById('iAmp').value) || 0;

      let pSuctBarAbs = (pSuctVal / pUnits[pUnitActual].factor) + pUnits[pUnitActual].atm;
      let pDescBarAbs = (pDescVal / pUnits[pUnitActual].factor) + pUnits[pUnitActual].atm;

      let tEvapOutC = (tUnitActual === 'F') ? (tEvapOutVal - 32) * 5/9 : tEvapOutVal;
      let tSuctC = (tUnitActual === 'F') ? (tSuctVal - 32) * 5/9 : tSuctVal;
      let tLiqC = (tUnitActual === 'F') ? (tLiqVal - 32) * 5/9 : tLiqVal;
      let tDescRealC = (tUnitActual === 'F') ? (tDescRealVal - 32) * 5/9 : tDescRealVal;

      const evapSat = interpolarDomo(pSuctBarAbs, ref);
      const condSat = interpolarDomo(pDescBarAbs, ref);

      let shUtilK = tEvapOutC - evapSat.tSat;
      let shTotalK = tSuctC - evapSat.tSat;
      let scK = condSat.tSat - tLiqC;
      let kW = (vVoltVal * iAmpVal * 0.85 * 1.732) / 1000.0;

      let h1 = evapSat.hV + (shTotalK * ref.cpV);
      let h3 = condSat.hL - (scK * ref.cpL);
      let h4 = h3;
      let h2 = condSat.hV + ((tDescRealC - condSat.tSat) * ref.cpV);

      let qn = h1 - h4;
      let w = h2 - h1;
      let cop = (w > 0) ? (qn / w) : 0;
      let deltaAmbK = condSat.tSat - tempAmbientePuntoFijoC;

      document.getElementById('kpiSHUtil').innerText = `${shUtilK.toFixed(1)} K`;
      document.getElementById('kpiSHTotal').innerText = `${shTotalK.toFixed(1)} K`;
      document.getElementById('kpiSC').innerText = `${scK.toFixed(1)} K`;
      document.getElementById('kpiKW').innerText = `${kW.toFixed(2)} kW`;
      document.getElementById('kpiqn').innerText = `${Math.round(qn)} kJ/kg`;
      document.getElementById('kpiw').innerText = `${Math.round(w)} kJ/kg`;
      document.getElementById('kpicop').innerText = cop.toFixed(2);
      document.getElementById('kpiDeltaAmb').innerText = `${deltaAmbK.toFixed(1)} K`;

      // Diagnóstico de Alertas
      const panel = document.getElementById('panelAlertas');
      panel.innerHTML = '';
      let alertas = [];

      if (shUtilK < ref.shOptimo[0]) alertas.push("⚠️ Sobrecalentamiento bajo: Riesgo de retorno de líquido al compresor.");
      if (shUtilK > ref.shOptimo[1]) alertas.push("⚠️ Sobrecalentamiento alto: Posible falta de refrigerante o restricción en la VET.");
      if (scK < ref.scOptimo[0]) alertas.push("⚠️ Subenfriamiento insuficiente: Condensación incompleta o falta de carga.");
      if (scK > ref.scOptimo[1]) alertas.push("⚠️ Subenfriamiento excesivo: Sobrecarga de refrigerante o condensador obstruido.");
      if (tDescRealC > ref.tDescMax) alertas.push(`🚨 Temp. Descarga Crítica (> ${ref.tDescMax}°C): Riesgo de degradación de aceite.`);

      if (alertas.length === 0) {
        panel.innerHTML = '<div class="diag-item" style="color:#10b981;">✅ Parámetros operativos dentro de rango nominal de diseño.</div>';
      } else {
        alertas.forEach(a => {
          const div = document.createElement('div');
          div.className = 'diag-item';
          div.style.color = a.includes('🚨') ? '#ef4444' : '#f59e0b';
          div.innerText = a;
          panel.appendChild(div);
        });
      }

      renderizarGrafica(ref, pSuctBarAbs, pDescBarAbs, h1, h2, h3, h4, evapSat, condSat);
    }

    function renderizarGrafica(ref, pSuctBar, pDescBar, h1, h2, h3, h4, evapSat, condSat) {
      let xDome = [], yDome = [];
      ref.dome.forEach(pt => { xDome.push(pt.hL); yDome.push(pt.p); });
      for (let i = ref.dome.length - 1; i >= 0; i--) { xDome.push(ref.dome[i].hV); yDome.push(ref.dome[i].p); }

      // Puntos Principales del Ciclo
      let xCiclo = [h4, h1, h2, h3, h4];
      let yCiclo = [pSuctBar, pSuctBar, pDescBar, pDescBar, pSuctBar];

      let dataTraces = [
        {
          x: xDome, y: yDome,
          type: 'scatter', mode: 'lines',
          name: 'Domo Sinc',
          line: { color: '#64748b', width: 2 }
        },
        {
          x: xCiclo, y: yCiclo,
          type: 'scatter', mode: 'lines+markers',
          name: 'Ciclo Real',
          line: { color: '#38bdf8', width: 3 },
          marker: { size: 6, color: '#f8fafc' }
        }
      ];

      // Puntos Intermedios de Consulta (Muestreo a lo largo de las líneas)
      if (mostrarPuntosIntermedios) {
        let xInter = [], yInter = [], hoverTexts = [];
        
        // Evaporación h4 -> h1 (10 puntos)
        for (let i = 1; i < 10; i++) {
          let h = h4 + (h1 - h4) * (i / 10);
          xInter.push(h); yInter.push(pSuctBar);
          hoverTexts.push(`<b>Evaporación (${i*10}%)</b><br>Enthalpía: ${h.toFixed(1)} kJ/kg<br>Presión: ${pSuctBar.toFixed(2)} bar`);
        }
        // Compresión h1 -> h2 (10 puntos)
        for (let i = 1; i < 10; i++) {
          let h = h1 + (h2 - h1) * (i / 10);
          let p = pSuctBar + (pDescBar - pSuctBar) * (i / 10);
          xInter.push(h); yInter.push(p);
          hoverTexts.push(`<b>Compresión (${i*10}%)</b><br>Enthalpía: ${h.toFixed(1)} kJ/kg<br>Presión: ${p.toFixed(2)} bar`);
        }
        // Condensación h2 -> h3 (10 puntos)
        for (let i = 1; i < 10; i++) {
          let h = h2 + (h3 - h2) * (i / 10);
          xInter.push(h); yInter.push(pDescBar);
          hoverTexts.push(`<b>Condensación (${i*10}%)</b><br>Enthalpía: ${h.toFixed(1)} kJ/kg<br>Presión: ${pDescBar.toFixed(2)} bar`);
        }
        // Expansión h3 -> h4 (10 puntos)
        for (let i = 1; i < 10; i++) {
          let p = pDescBar + (pSuctBar - pDescBar) * (i / 10);
          xInter.push(h4); yInter.push(p);
          hoverTexts.push(`<b>Expansión (${i*10}%)</b><br>Enthalpía: ${h4.toFixed(1)} kJ/kg<br>Presión: ${p.toFixed(2)} bar`);
        }

        dataTraces.push({
          x: xInter, y: yInter,
          type: 'scatter', mode: 'markers',
          name: 'Consultas Intermedias',
          text: hoverTexts,
          hoverinfo: 'text',
          marker: { size: 5, color: '#f59e0b', symbol: 'circle-open' }
        });
      }

      let layout = {
        margin: { l: 40, r: 15, t: 15, b: 35 },
        paper_bgcolor: 'rgba(0,0,0,0)',
        plot_bgcolor: 'rgba(15, 23, 42, 0.6)',
        xaxis: {
          title: { text: 'Entalpía h (kJ/kg)', font: { size: 10, color: '#94a3b8' } },
          tickfont: { size: 9, color: '#f8fafc' },
          gridcolor: '#334155',
          range: zonaActivaHabilitada ? [Math.max(0, h4 - 40), h2 + 40] : ref.xRange
        },
        yaxis: {
          title: { text: `Presión P (${pUnits[pUnitActual].label})`, font: { size: 10, color: '#94a3b8' } },
          type: 'log',
          tickfont: { size: 9, color: '#f8fafc' },
          gridcolor: '#334155'
        },
        showlegend: false
      };

      Plotly.newPlot('mollierPlot', dataTraces, layout, { responsive: true, displayModeBar: false });
    }

    function descargarPDFReporte() {
      const element = document.getElementById('reporteArea');
      document.body.classList.add('generating-pdf');

      const opt = {
        margin: [4, 4, 4, 4],
        filename: `Reporte_Mollier_${document.getElementById('refSelect').value}.pdf`,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2, useCORS: true, logging: false },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };

      html2pdf().set(opt).from(element).save().then(() => {
        document.body.classList.remove('generating-pdf');
      });
    }

    window.onload = () => {
      setInterval(actualizarReloj, 1000);
      actualizarReloj();
      obtenerClimaPuntoFijo();
      actualizarEtiquetas();
      guardarYActualizar();
    };
