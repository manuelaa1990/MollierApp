<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Diagramas de Mollier (p-h) Pro - Mediciones y Diagnóstico de Campo</title>
  
  <!-- CDNs necesarios: Plotly para la gráfica y html2pdf para generar el PDF -->
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow-x: hidden;
      overflow-y: auto;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 100vw;
      min-height: 100dvh;
      padding: 4px;
      gap: 4px;
      overflow-x: hidden;
    }

    /* Barra superior con hora activa y clima */
    .top-info-bar {
      background: #1e293b;
      border: 1px solid #38bdf8;
      border-radius: 6px;
      padding: 3px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.70rem;
      color: #38bdf8;
      font-weight: bold;
    }

    .top-info-bar .date-time-box {
      color: #f8fafc;
      font-size: 0.68rem;
    }

    /* Formulario compacto de identificación profesional */
    .prof-header-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 4px 6px;
    }

    .prof-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 3px;
    }

    .prof-grid .input-group {
      display: flex;
      flex-direction: column;
    }

    .prof-grid label {
      font-size: 0.52rem;
      color: #38bdf8;
      font-weight: bold;
      margin-bottom: 1px;
      white-space: nowrap;
    }

    .prof-grid input {
      padding: 2px 4px;
      border: 1px solid #475569;
      border-radius: 4px;
      font-size: 0.68rem;
      background-color: #0f172a;
      color: #f8fafc;
      height: 22px;
    }

    /* Nueva fila para el input de capacidad con selector de unidad */
    .cap-input-row {
      display: flex;
      gap: 4px;
      align-items: center;
    }
    .cap-input-row input {
      flex: 2;
      padding: 2px 6px;
      border: 1px solid #475569;
      border-radius: 4px;
      font-size: 0.68rem;
      background-color: #0f172a;
      color: #f8fafc;
      height: 22px;
    }
    .cap-input-row select {
      flex: 1;
      padding: 2px 6px;
      border: 1px solid #475569;
      border-radius: 4px;
      font-size: 0.68rem;
      background-color: #0f172a;
      color: #f8fafc;
      height: 22px;
      cursor: pointer;
      border-color: #38bdf8;
      font-weight: 600;
    }

    .top-panel {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 4px;
      flex-shrink: 0;
      width: 100%;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 4px 6px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      width: 100%;
    }

    .card h2 {
      font-size: 0.72rem;
      text-transform: uppercase;
      color: #38bdf8;
      margin-bottom: 3px;
      letter-spacing: 0.5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .config-row {
      display: flex;
      gap: 4px;
      margin-bottom: 3px;
      width: 100%;
    }

    .config-row .input-group-ref { flex: 2; min-width: 0; }
    .config-row .input-group-unit { flex: 1; min-width: 0; }

    .controls-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 3px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      border-radius: 4px;
      padding: 1px;
    }

    .input-group label {
      font-size: 0.55rem;
      font-weight: 600;
      margin-bottom: 1px;
      color: #94a3b8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .input-group input, .input-group select {
      padding: 2px 4px;
      border: 1px solid #475569;
      border-radius: 4px;
      font-size: 0.72rem;
      outline: none;
      background-color: #0f172a;
      color: #f8fafc;
      width: 100%;
      height: 24px;
    }

    .input-group select {
      cursor: pointer;
      border-color: #38bdf8;
      font-weight: 600;
    }

    .input-group select optgroup {
      background-color: #1e293b;
      color: #38bdf8;
      font-weight: bold;
    }

    .input-group select option {
      background-color: #0f172a;
      color: #f8fafc;
    }

    .action-bar {
      display: flex;
      gap: 4px;
      margin-bottom: 3px;
      width: 100%;
      flex-shrink: 0;
    }

    .btn {
      flex: 1;
      padding: 3px 6px;
      border: none;
      border-radius: 4px;
      font-size: 0.68rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      height: 26px;
    }

    /* Botón verde estricto para el reporte */
    .btn-reporte {
      background-color: #10b981;
      color: #ffffff;
    }
    .btn-reporte:hover {
      background-color: #059669;
    }

    .btn-toggle { background-color: #334155; color: #cbd5e1; }
    .btn-toggle.active {
      background-color: #0284c7;
      color: #ffffff;
      box-shadow: 0 0 6px rgba(2, 132, 199, 0.4);
    }

    .results-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 3px;
      margin-bottom: 4px;
    }

    .kpi-box {
      background-color: #0f172a;
      border-left: 3px solid #38bdf8;
      padding: 2px 3px;
      border-radius: 4px;
    }

    .kpi-box .label {
      font-size: 0.50rem;
      color: #94a3b8;
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .kpi-box .value {
      font-size: 0.68rem;
      font-weight: 700;
      color: #f8fafc;
    }

    .diag-container {
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 4px 6px;
      width: 100%;
    }

    .diag-item {
      font-size: 0.62rem;
      margin-bottom: 2px;
      line-height: 1.2;
      display: flex;
      align-items: flex-start;
      gap: 4px;
      text-align: justify;
    }

    .diag-item:last-child {
      margin-bottom: 0;
    }

    .chart-card {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 100vw;
      padding: 2px;
      overflow: hidden;
      box-sizing: border-box;
    }

    .chart-container {
      width: 100%;
      max-width: 100%;
      height: 260px;
      overflow: hidden;
    }

    .alarm-field-active {
      animation: blink-field 0.8s infinite alternate !important;
      border-radius: 6px;
      padding: 2px 4px !important;
    }

    .alarm-field-active input {
      background-color: #7f1d1d !important;
      color: #ffffff !important;
      border-color: #ef4444 !important;
      font-weight: bold;
    }

    .alarm-field-active label {
      color: #fca5a5 !important;
      font-weight: bold;
    }

    @keyframes blink-field {
      0% {
        background-color: rgba(239, 68, 68, 0.9);
        box-shadow: 0 0 10px rgba(239, 68, 68, 0.8);
      }
      100% {
        background-color: rgba(127, 29, 29, 0.3);
        box-shadow: 0 0 2px rgba(239, 68, 68, 0.2);
      }
    }

    /* Ajustes específicos de impresión para cuando html2pdf captura la pantalla */
    body.generating-pdf {
      background-color: #ffffff !important;
      color: #000000 !important;
    }
    body.generating-pdf .card, 
    body.generating-pdf .prof-header-card, 
    body.generating-pdf .top-info-bar,
    body.generating-pdf .diag-container,
    body.generating-pdf .kpi-box {
      background-color: #ffffff !important;
      border-color: #cccccc !important;
      color: #000000 !important;
    }
    body.generating-pdf input, 
    body.generating-pdf select {
      background-color: #ffffff !important;
      color: #000000 !important;
      border-color: #999999 !important;
    }
    body.generating-pdf .action-bar {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="app-container" id="reporteArea">
    
    <!-- Barra superior con Fecha, Hora Activa y Clima -->
    <div class="top-info-bar">
      <div class="date-time-box">
        📅 <span id="txtFechaHora">Cargando fecha y hora...</span>
      </div>
      <div>
        📍 Punto Fijo: <span id="txtTempAmb">Cargando...</span>
      </div>
    </div>

    <!-- Identificación Profesional y Datos del Equipo -->
    <div class="prof-header-card">
      <div class="prof-grid">
        <div class="input-group">
          <label for="empresaNombre">Empresa</label>
          <input type="text" id="empresaNombre" value="Servicios Técnicos" oninput="guardarYActualizar()">
        </div>

        <div class="input-group">
          <label for="empresaRif">RIF / ID Fiscal</label>
          <input type="text" id="empresaRif" value="J-00000000-0" oninput="guardarYActualizar()">
        </div>

        <div class="input-group">
          <label for="tecnicoNombre">Técnico Evaluante</label>
          <input type="text" id="tecnicoNombre" value="Téc. Especialista" oninput="guardarYActualizar()">
        </div>

        <div class="input-group">
          <label for="equipoMarca">Marca del Equipo</label>
          <input type="text" id="equipoMarca" value="Daikin" oninput="guardarYActualizar()">
        </div>

        <div class="input-group">
          <label for="equipoModelo">Modelo</label>
          <input type="text" id="equipoModelo" value="XL10-2026" oninput="guardarYActualizar()">
        </div>

        <div class="input-group">
          <label for="capFrigValue">Cap. Frigorífica</label>
          <div class="cap-input-row">
            <input type="number" id="capFrigValue" value="36000" oninput="guardarYActualizar()" step="1" />
            <select id="capUnitSelect" onchange="guardarYActualizar()">
              <option value="BTU/h" selected>BTU/h</option>
              <option value="kW">kW</option>
              <option value="Ton">Ton</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <header class="top-panel">
      <div class="card" id="cardDatosCampo">
        <h2><span>Datos de Campo</span></h2>
        
        <div class="config-row">
          <div class="input-group input-group-ref">
            <label for="refSelect">Refrigerante</label>
            <select id="refSelect" onchange="guardarYActualizar()">
              <optgroup label="Puros y Tradicionales">
                <option value="R134a">R-134a</option>
                <option value="R22">R-22</option>
                <option value="R410A">R-410A</option>
                <option value="R32">R-32</option>
              </optgroup>
              <optgroup label="Hidrocarburos (HC)">
                <option value="R290">R-290 (Propano)</option>
                <option value="R600a">R-600a (Isobutano)</option>
              </optgroup>
              <optgroup label="Mezclas HFC (Serie 400 / 500)">
                <option value="R404A" selected>R-404A</option>
                <option value="R507A">R-507A</option>
                <option value="R407C">R-407C</option>
              </optgroup>
            </select>
          </div>

          <div class="input-group input-group-unit">
            <label for="pUnitSelect">U. Presión</label>
            <select id="pUnitSelect" onchange="cambiarUnidades()">
              <option value="psi" selected>PSI</option>
              <option value="bar">Bar</option>
              <option value="kpa">kPa</option>
            </select>
          </div>

          <div class="input-group input-group-unit">
            <label for="tUnitSelect">U. Temp</label>
            <select id="tUnitSelect" onchange="cambiarUnidades()">
              <option value="C" selected>°C</option>
              <option value="F">°F</option>
            </select>
          </div>
        </div>

        <div class="controls-grid">
          <div class="input-group" id="grpPSuct">
            <label for="pSuct" id="lblPSuct">P. Succión</label>
            <input type="number" id="pSuct" value="25" step="1" oninput="guardarYActualizar()">
          </div>

          <div class="input-group" id="grpPDesc">
            <label for="pDesc" id="lblPDesc">P. Descarga</label>
            <input type="number" id="pDesc" value="290" step="1" oninput="guardarYActualizar()">
          </div>

          <div class="input-group" id="grpTEvapOut">
            <label for="tEvapOut" id="lblTEvapOut">T. Salida Evap</label>
            <input type="number" id="tEvapOut" value="-12" step="0.5" oninput="guardarYActualizar()">
          </div>

          <div class="input-group" id="grpTSuct">
            <label for="tSuct" id="lblTSuct">T. Temp Succión</label>
            <input type="number" id="tSuct" value="-10" step="0.5" oninput="guardarYActualizar()">
          </div>

          <div class="input-group" id="grpTLiq">
            <label for="tLiq" id="lblTLiq">T. Tubería Liq</label>
            <input type="number" id="tLiq" value="45" step="0.5" oninput="guardarYActualizar()">
          </div>

          <div class="input-group" id="grpTDescReal">
            <label for="tDescReal" id="lblTDescReal">T. Descarga</label>
            <input type="number" id="tDescReal" value="90" step="1" oninput="guardarYActualizar()">
          </div>

          <div class="input-group">
            <label for="vVolt">Voltaje (V)</label>
            <input type="number" id="vVolt" value="220" step="1" oninput="guardarYActualizar()">
          </div>

          <div class="input-group">
            <label for="iAmp">Amperaje (A)</label>
            <input type="number" id="iAmp" value="22" step="0.1" oninput="guardarYActualizar()">
          </div>
        </div>

      </div>

      <div class="card" id="cardIndicadores">
        <h2>Indicadores y Diagnóstico</h2>
        <div class="results-grid">
          <div class="kpi-box" style="border-left-color: #38bdf8;">
            <span class="label">SH Útil (Evap)</span>
            <span class="value" id="kpiSHUtil">0.0 K</span>
          </div>
          <div class="kpi-box" style="border-left-color: #0284c7;">
            <span class="label">SH Total (Succ)</span>
            <span class="value" id="kpiSHTotal">0.0 K</span>
          </div>
          <div class="kpi-box" style="border-left-color: #10b981;">
            <span class="label">Subenfriam. (SC)</span>
            <span class="value" id="kpiSC">0.0 K</span>
          </div>
          <div class="kpi-box" style="border-left-color: #f59e0b;">
            <span class="label">Potencia Elec.</span>
            <span class="value" id="kpiKW">0.00 kW</span>
          </div>
          <div class="kpi-box" style="border-left-color: #a855f7;">
            <span class="label">Cap. Frig. (qn)</span>
            <span class="value" id="kpiqn">0 kJ/kg</span>
          </div>
          <div class="kpi-box" style="border-left-color: #ef4444;">
            <span class="label">Trabajo Comp (w)</span>
            <span class="value" id="kpiw">0 kJ/kg</span>
          </div>
          <div class="kpi-box" style="border-left-color: #ec4899;">
            <span class="label">COP Estimado</span>
            <span class="value" id="kpicop">0.0</span>
          </div>
          <div class="kpi-box" style="border-left-color: #64748b;">
            <span class="label">ΔT Cond - Amb</span>
            <span class="value" id="kpiDeltaAmb">0.0 K</span>
          </div>
        </div>

        <div class="diag-container" id="panelAlertas">
        </div>
      </div>

    </header>

    <main class="card chart-card">
      <div class="action-bar">
        <button class="btn btn-toggle" id="btnZonaActiva" onclick="toggleZonaActiva()">
          🔍 Zoom Zona Activa: OFF
        </button>
        <!-- Botón verde de reporte -->
        <button class="btn btn-reporte" onclick="descargarPDFReporte()">
          📄 Reporte
        </button>
      </div>

      <div id="mollierPlot" class="chart-container"></div>
    </main>

  </div>

    async function obtenerClimaPuntoFijo() {
      const lbl = document.getElementById('txtTempAmb');
      try {
        const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=11.7&longitude=-70.2&current_weather=true');
        const data = await res.json();
        if (data && data.current_weather) {
          tempAmbientePuntoFijoC = data.current_weather.temperature;
          let tempMostrar = convertirTemp(tempAmbientePuntoFijoC);
          lbl.innerText = `${tempMostrar.toFixed(1)} °${tUnitActual}`;
          guardarYActualizar();
        } else {
          lbl.innerText = "30.0 °C";
        }
      } catch (e) {
        lbl.innerText = "30.0 °C";
      }
    }

    function cambiarUnidades() {
      const nuevaPUnit = document.getElementById('pUnitSelect').value;
      const nuevaTUnit = document.getElementById('tUnitSelect').value;

      const pFactorViejo = pUnits[pUnitActual].factor;
      const pFactorNuevo = pUnits[nuevaPUnit].factor;

      ['pSuct', 'pDesc'].forEach(id => {
        const elem = document.getElementById(id);
        const valBar = parseFloat(elem.value) / pFactorViejo;
        elem.value = (valBar * pFactorNuevo).toFixed(nuevaPUnit === 'psi' ? 0 : 1);
      });

      if (tUnitActual !== nuevaTUnit) {
        ['tEvapOut', 'tSuct', 'tLiq', 'tDescReal'].forEach(id => {
          const elem = document.getElementById(id);
          let val = parseFloat(elem.value);
          if (nuevaTUnit === 'F') {
            elem.value = (val * 9/5 + 32).toFixed(1);
          } else {
            elem.value = ((val - 32) * 5/9).toFixed(1);
          }
        });
      }

      pUnitActual = nuevaPUnit;
      tUnitActual = nuevaTUnit;

      actualizarEtiquetas();
      obtenerClimaPuntoFijo();
    }

            else if (s.includes('kw')) document.getElementById('capUnitSelect').value = 'kW';

    function getPropAtP(refData, pBarAbs) {
      const dome = refData.dome;
      if (pBarAbs <= dome[0].p) return dome[0];
      if (pBarAbs >= refData.criticalP) return dome[dome.length - 1];

      for (let i = 0; i < dome.length - 1; i++) {
        if (pBarAbs >= dome[i].p && pBarAbs <= dome[i+1].p) {
          const logP = Math.log(pBarAbs);
          const logP1 = Math.log(dome[i].p);
          const logP2 = Math.log(dome[i+1].p);
          const factor = (logP - logP1) / (logP2 - logP1);

          return {
            hL: dome[i].hL + factor * (dome[i+1].hL - dome[i].hL),
            hV: dome[i].hV + factor * (dome[i+1].hV - dome[i].hV),
            tSat: dome[i].tSat + factor * (dome[i+1].tSat - dome[i].tSat)
          };
        }
      }
      return dome[0];
    }

    function getZoneTraces(refData, minX, maxX) {
      const f = pUnits[pUnitActual].factor;
      const dome = refData.dome;

      const pVals = dome.map(pt => pt.p * f);
      const hLVals = dome.map(pt => pt.hL);
      const hVVals = dome.map(pt => pt.hV);

      const pTop = pVals[pVals.length - 1];
      const pBot = pVals[0];

      const liquidX = [minX, minX];
      const liquidY = [pBot, pTop];
      for (let i = dome.length - 1; i >= 0; i--) {
        liquidX.push(hLVals[i]);
        liquidY.push(pVals[i]);
      }

      const traceLiquid = {
        x: liquidX, y: liquidY, fill: 'toself',
        fillcolor: 'rgba(2, 132, 199, 0.22)', line: { color: 'transparent' },
        name: 'Líquido', showlegend: false, hoverinfo: 'none'
      };

      const satX = []; const satY = [];
      for (let i = 0; i < dome.length; i++) { satX.push(hLVals[i]); satY.push(pVals[i]); }
      for (let i = dome.length - 1; i >= 0; i--) { satX.push(hVVals[i]); satY.push(pVals[i]); }

      const traceSat = {
        x: satX, y: satY, fill: 'toself',
        fillcolor: 'rgba(16, 185, 129, 0.22)', line: { color: 'transparent' },
        name: 'Mezcla', showlegend: false, hoverinfo: 'none'
      };

      const vaporX = []; const vaporY = [];
      for (let i = 0; i < dome.length; i++) { vaporX.push(hVVals[i]); vaporY.push(pVals[i]); }
      vaporX.push(maxX, maxX);
      vaporY.push(pTop, pBot);

      const traceVapor = {
        x: vaporX, y: vaporY, fill: 'toself',
        fillcolor: 'rgba(245, 158, 11, 0.20)', line: { color: 'transparent' },
        name: 'Vapor', showlegend: false, hoverinfo: 'none'
      };

      return [traceLiquid, traceSat, traceVapor];
    }

    function getDomeTrace(refData) {
      const hVals = [];

      const tempsText = [];
      const f = pUnits[pUnitActual].factor;

      refData.dome.forEach(pt => {

        tempsText.push(`${convertirTemp(pt.tSat).toFixed(1)} °${tUnitActual}`);

      };
    }

    function evaluarDiagnostico(refData, rP, tDescRealC, tLiqC, tSatCondC, SHUtil, SHTotal, SC, dischargeSuperHeatK, tempAmbienteC) {
      const alertas = [];
      let alarmaTDesc = false;
      let alarmaTLiq = false;

      const deltaTCondAmb = tSatCondC - tempAmbienteC;

      if (tDescRealC > refData.tDescMax) {
        alarmaTDesc = true;
        alertas.push(`🔴 <b>CRÍTICO (T. Descarga ${tDescRealC.toFixed(0)}°C):</b> Supera el límite de ${refData.tDescMax}°C para ${refData.nombre}.`);
      }

      if (tLiqC >= tSatCondC) {
        alarmaTLiq = true;
        alertas.push(`🔴 <b>ALERTA (T. Líquido ${tLiqC.toFixed(1)}°C):</b> Sin Subenfriamiento (T. Líquido ≥ T. Sat ${tSatCondC.toFixed(1)}°C). Riesgo de Flash Gas.`);
      }

      if (SC < 3.0 && !alarmaTLiq) {
        if (deltaTCondAmb > 18.0 || rP > refData.rPMax) {
          alertas.push(`🔴 <b>CONDENSADOR SUCIO (SC = ${SC.toFixed(1)} K):</b> Subenfriamiento bajo con ΔT Cond-Amb elevado (${deltaTCondAmb.toFixed(1)} K).`);
        } else if (SHTotal > refData.shOptimo[1]) {
          alertas.push(`🟡 <b>FALTA DE REFRIGERANTE (SC = ${SC.toFixed(1)} K):</b> Subenfriamiento bajo y Recalentamiento elevado (${SHTotal.toFixed(1)} K).`);
        } else {
          alertas.push(`🟡 <b>Subenfriamiento Bajo (< 3.0 K):</b> Subenfriamiento insuficiente (${SC.toFixed(1)} K).`);
        }
      } else if (SC > refData.scOptimo[1]) {
        alertas.push(`🔵 <b>Subenfriamiento Alto (> ${refData.scOptimo[1]} K):</b> Exceso de carga de refrigerante.`);
      }

      if (rP > refData.rPMax) {
        alertas.push(`🔴 <b>Relación de Presión Excesiva (rP = ${rP.toFixed(1)} > ${refData.rPMax}):</b> Compresor fuera de rango.`);
      }

      if (SHUtil < refData.shOptimo[0]) {
        alertas.push(`🔴 <b>Recalentamiento Útil Crítico (< ${refData.shOptimo[0]} K):</b> Riesgo de retorno de líquido.`);
      } else if (SHUtil > refData.shOptimo[1]) {
        alertas.push(`🟡 <b>Recalentamiento Útil Alto (> ${refData.shOptimo[1]} K):</b> Evaporador subalimentado.`);
      }

      return { alertas, alarmaTDesc, alarmaTLiq };
    }

    function actualizarTodo() {
      const refKey = document.getElementById('refSelect').value;
      const refData = refrigerantes[refKey];
      const pf = pUnits[pUnitActual].factor;

      let pSuctInput = parseFloat(document.getElementById('pSuct').value);
      let pDescInput = parseFloat(document.getElementById('pDesc').value);

      if (isNaN(pSuctInput)) pSuctInput = 25;
      if (isNaN(pDescInput)) pDescInput = 290;

      const barFactor = (pUnitActual === 'psi') ? 14.5038 : ((pUnitActual === 'kpa') ? 100 : 1.0);
      const atmBar = 1.01325;

      const pSuctBarAbs = Math.max((pSuctInput / barFactor) + atmBar, 0.2);
      const pDescBarAbs = Math.min((pDescInput / barFactor) + atmBar, refData.criticalP - 0.2);

      let tEvapOutVal = parseFloat(document.getElementById('tEvapOut').value) || -12;
      let tSuctVal = parseFloat(document.getElementById('tSuct').value) || -10;
      let tLiqVal = parseFloat(document.getElementById('tLiq').value) || 45;
      let tDescRealVal = parseFloat(document.getElementById('tDescReal').value) || 90;

      let tEvapOutC = tEvapOutVal;
      let tSuctC = tSuctVal;
      let tLiqC = tLiqVal;
      let tDescRealC = tDescRealVal;

      if (tUnitActual === 'F') {
        tEvapOutC = (tEvapOutVal - 32) * 5/9;
        tSuctC = (tSuctVal - 32) * 5/9;
        tLiqC = (tLiqVal - 32) * 5/9;
        tDescRealC = (tDescRealVal - 32) * 5/9;
      }

      const vVolt = parseFloat(document.getElementById('vVolt').value) || 220;
      const iAmp = parseFloat(document.getElementById('iAmp').value) || 0;
      const pKw = (vVolt * iAmp * 0.9) / 1000.0;

      const propEvap = getPropAtP(refData, pSuctBarAbs);
      const propCond = getPropAtP(refData, pDescBarAbs);

      const superHeatUtilK = Math.max(tEvapOutC - propEvap.tSat, 0);
      const superHeatTotalK = Math.max(tSuctC - propEvap.tSat, 0);
      const subCoolK = Math.max(propCond.tSat - tLiqC, 0);
      const dischargeSuperHeatK = Math.max(tDescRealC - propCond.tSat, 0);

      const deltaTCondAmb = propCond.tSat - tempAmbientePuntoFijoC;

      const h1 = propEvap.hV + (superHeatTotalK * refData.cpV);
      const h3 = propCond.hL - (subCoolK * refData.cpL);
      const h4 = h3; 

      const qn = h1 - h4;

      const rP = pDescBarAbs / pSuctBarAbs;
      const deltaH_isentropico = h1 * 0.15 * Math.log(rP); 
      const deltaT_superheat_desc = Math.max(tDescRealC - propCond.tSat, 0);
      const h2_termico = propCond.hV + (deltaT_superheat_desc * refData.cpV);

      const h2 = Math.max(h1 + deltaH_isentropico, h2_termico);

      const w = h2 - h1;
      const cop = w > 0 ? (qn / w) : 0;

      document.getElementById('kpiSHUtil').innerText = `${superHeatUtilK.toFixed(1)} K`;
      document.getElementById('kpiSHTotal').innerText = `${superHeatTotalK.toFixed(1)} K`;
      document.getElementById('kpiSC').innerText = `${subCoolK.toFixed(1)} K`;
      document.getElementById('kpiKW').innerText = `${pKw.toFixed(2)} kW`;
      document.getElementById('kpiqn').innerText = `${qn.toFixed(1)} kJ/kg`;
      document.getElementById('kpiw').innerText = `${w.toFixed(1)} kJ/kg`;
      document.getElementById('kpicop').innerText = cop.toFixed(2);
      document.getElementById('kpiDeltaAmb').innerText = `${deltaTCondAmb.toFixed(1)} K`;

      const { alertas, alarmaTDesc, alarmaTLiq } = evaluarDiagnostico(
        refData, rP, tDescRealC, tLiqC, propCond.tSat, superHeatUtilK, superHeatTotalK, subCoolK, dischargeSuperHeatK, tempAmbientePuntoFijoC
      );
      
      const grpDesc = document.getElementById('grpTDescReal');
      const grpLiq = document.getElementById('grpTLiq');
      const panelAlertas = document.getElementById('panelAlertas');

      if (alarmaTDesc) grpDesc.classList.add('alarm-field-active');
      else grpDesc.classList.remove('alarm-field-active');

      if (alarmaTLiq) grpLiq.classList.add('alarm-field-active');
      else grpLiq.classList.remove('alarm-field-active');

      if (alertas.length === 0) {
        panelAlertas.innerHTML = `<div class="diag-item" style="color: #34d399; text-align: left;">✅ <b>Sistema Estable:</b> El equipo con ${refData.nombre} opera dentro de los parámetros previstos.</div>`;
      } else {
        panelAlertas.innerHTML = alertas.map(a => `<div class="diag-item" style="color: #cbd5e1;">${a}</div>`).join('');
      }

      const pSuctPlot = pSuctBarAbs * pf;
      const pDescPlot = pDescBarAbs * pf;

      const minX = refData.xRange[0];
      const maxX = refData.xRange[1];

      const zoneTraces = getZoneTraces(refData, minX, maxX);

      const t1Str = `${convertirTemp(tSuctC).toFixed(1)} °${tUnitActual}`;
      const t2Str = `${convertirTemp(tDescRealC).toFixed(1)} °${tUnitActual}`;
      const t3Str = `${convertirTemp(tLiqC).toFixed(1)} °${tUnitActual}`;
      const t4Str = `${convertirTemp(propEvap.tSat).toFixed(1)} °${tUnitActual}`;

      const cycleTrace = {
        x: [h1, h2, h3, h4, h1],
        y: [pSuctPlot, pDescPlot, pDescPlot, pSuctPlot, pSuctPlot],
        mode: 'lines+markers+text',
        name: 'Ciclo Operativo',
        text: ['1', '2', '3', '4', '1'],
        textposition: 'top center',
        textfont: { size: 8, color: '#f8fafc' },
        line: { color: '#ef4444', width: 2.2 },
        marker: { size: 6, color: '#f59e0b' },
        hovertemplate: '<b>Punto %{text} del Ciclo</b><br>' +
                       'Temp: %{customdata}<br>' +
                       'P: %{y:.1f} ' + pUnits[pUnitActual].label + '<br>' +
                       'h: %{x:.1f} kJ/kg<extra></extra>',
        customdata: [t1Str, t2Str, t3Str, t4Str, t1Str]
      };

      const domeTrace = getDomeTrace(refData);

      const layout = {
        autosize: true,
        margin: { l: 22, r: 10, t: 10, b: 22 },
        paper_bgcolor: '#1e293b',
        plot_bgcolor: '#0f172a',
        showlegend: false,
        xaxis: {
          title: 'h (kJ/kg)',
          titlefont: { size: 7, color: '#94a3b8' },
          tickfont: { size: 6.5, color: '#cbd5e1' },
          gridcolor: '#334155',
          zeroline: false,
          autorange: !zonaActivaHabilitada,
          range: zonaActivaHabilitada ? [Math.max(h4 - 25, minX), Math.min(h2 + 25, maxX)] : undefined
        },
        yaxis: {
          title: `P. Abs (${pUnits[pUnitActual].label})`,
          titlefont: { size: 7, color: '#94a3b8' },
          tickfont: { size: 6.5, color: '#cbd5e1' },
          type: 'log',
          automargin: true,
          gridcolor: '#334155',
          zeroline: false,
          autorange: !zonaActivaHabilitada,
          range: zonaActivaHabilitada ? [Math.log10(pSuctPlot * 0.75), Math.log10(pDescPlot * 1.25)] : undefined
        }
      };

      Plotly.react('mollierPlot', [...zoneTraces, domeTrace, cycleTrace], layout, { responsive: true, displayModeBar: false });
    }

    window.addEventListener('DOMContentLoaded', () => {
      cargarConfiguracion();
      actualizarEtiquetas();
      actualizarReloj();
      setInterval(actualizarReloj, 1000);
      obtenerClimaPuntoFijo();
    });
  </script>
</body>
</html>
