<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analizador de Ciclo de Refrigeración - Diagrama Mollier</title>
  <!-- Plotly.js para la representación del diagrama Ph -->
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #e0e0e0;
      --accent: #00bcd4;
      --border-color: #333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* --- OVERLAY DE ORIENTACIÓN PARA MÓVILES --- */
    .orientation-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(18, 18, 18, 0.98);
      z-index: 9999;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    .orientation-overlay .icon {
      font-size: 3.5rem;
      margin-bottom: 20px;
      animation: rotatePhone 2s infinite ease-in-out;
    }

    .orientation-overlay p {
      color: var(--accent);
      font-size: 1.2rem;
      font-weight: 600;
      max-width: 320px;
      line-height: 1.4;
    }

    @keyframes rotatePhone {
      0% { transform: rotate(0deg); }
      50% { transform: rotate(-90deg); }
      100% { transform: rotate(0deg); }
    }

    /* Activación del overlay en modo Portrait */
    @media screen and (max-width: 850px) and (orientation: portrait) {
      .orientation-overlay {
        display: flex;
      }
    }

    /* --- LAYOUT DE LA APLICACIÓN --- */
    header {
      background-color: var(--card-bg);
      padding: 10px 20px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      font-size: 1.2rem;
      color: var(--accent);
    }

    .main-container {
      display: grid;
      grid-template-columns: 320px 1fr;
      height: calc(100vh - 45px);
      width: 100%;
    }

    .sidebar {
      background-color: var(--card-bg);
      border-right: 1px solid var(--border-color);
      padding: 15px;
      overflow-y: auto;
    }

    .plot-container {
      width: 100%;
      height: 100%;
      background-color: var(--bg-color);
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 4px;
      color: #aaa;
    }

    select, input {
      width: 100%;
      padding: 8px;
      background-color: #2a2a2a;
      border: 1px solid var(--border-color);
      color: #fff;
      border-radius: 4px;
      font-size: 0.9rem;
    }

    .metrics-panel {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid var(--border-color);
    }

    .metric-card {
      background-color: #252525;
      padding: 8px 12px;
      border-radius: 4px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }

    .metric-value {
      font-weight: bold;
      color: var(--accent);
    }
  </style>
</head>
<body>

  <!-- PANTALLA BLOQUEADORA CSS -->
  <div class="orientation-overlay">
    <div class="icon">📱</div>
    <p>Gira tu dispositivo horizontalmente para analizar el Diagrama Mollier y el panel de control.</p>
  </div>

  <header>
    <h1>Analizador de Ciclo Termodinámico (Mollier P-h)</h1>
    <span id="sys-status" style="font-size: 0.8rem; color: #4caf50;">● Sistema Listo</span>
  </header>

  <div class="main-container">
    <!-- PANEL LATERAL DE PARÁMETROS -->
    <div class="sidebar">
      <div class="form-group">
        <label for="refrigerant">Refrigerante</label>
        <select id="refrigerant">
          <option value="R134a">R-134a</option>
          <option value="R404A">R-404A</option>
          <option value="R22">R-22</option>
        </select>
      </div>

      <div class="form-group">
        <label for="p-evap">Presión Evaporación (PSI)</label>
        <input type="number" id="p-evap" value="18.5" step="0.1">
      </div>

      <div class="form-group">
        <label for="p-cond">Presión Condensación (PSI)</label>
        <input type="number" id="p-cond" value="135.0" step="0.1">
      </div>

      <div class="form-group">
        <label for="subcooling">Subenfriamiento (°K)</label>
        <input type="number" id="subcooling" value="5.0" step="0.5">
      </div>

      <div class="form-group">
        <label for="superheat">Recalentamiento (°K)</label>
        <input type="number" id="superheat" value="7.0" step="0.5">
      </div>

      <!-- RESULTADOS Y MÉTRICAS CALCULADAS -->
      <div class="metrics-panel">
        <div class="metric-card">
          <span>COP Teórico:</span>
          <span class="metric-value" id="cop-val">3.82</span>
        </div>
        <div class="metric-card">
          <span>Efecto Refrig.:</span>
          <span class="metric-value" id="er-val">142.5 kJ/kg</span>
        </div>
        <div class="metric-card">
          <span>Trabajo Comp.:</span>
          <span class="metric-value" id="w-val">37.3 kJ/kg</span>
        </div>
      </div>
    </div>

    <!-- ÁREA DEL GRÁFICO MOLLIER -->
    <div class="plot-container" id="mollier-chart"></div>
  </div>

  <script>
    // Inicialización del gráfico con Plotly
    function drawMollierChart() {
      // Curva de saturación simplificada (Presión vs Entalpía)
      const enthalpySatLiq = [150, 170, 190, 210, 230, 250, 270, 290];
      const enthalpySatVap = [390, 395, 400, 402, 403, 401, 395, 380];
      const pressureDome   = [0.5, 1.0, 2.0, 4.0, 8.0, 12.0, 18.0, 26.0];

      // Puntos del ciclo frigorífico (1: Succión, 2: Descarga, 3: Líquido, 4: Expansión)
      const cycleEnthalpy = [410, 447.3, 267.5, 267.5, 410];
      const cyclePressure = [1.2, 9.3, 9.3, 1.2, 1.2];

      const traceDomeLiq = {
        x: enthalpySatLiq,
        y: pressureDome,
        mode: 'lines',
        name: 'Líquido Saturado',
        line: { color: '#2196F3', width: 2 }
      };

      const traceDomeVap = {
        x: enthalpySatVap,
        y: pressureDome,
        mode: 'lines',
        name: 'Vapor Saturado',
        line: { color: '#f44336', width: 2 }
      };

      const traceCycle = {
        x: cycleEnthalpy,
        y: cyclePressure,
        mode: 'lines+markers',
        name: 'Ciclo Real',
        line: { color: '#00bcd4', width: 3 },
        marker: { size: 6, color: '#ffffff' }
      };

      const layout = {
        title: { text: 'Diagrama Presión - Entalpía (P-h)', font: { color: '#e0e0e0' } },
        paper_bgcolor: '#121212',
        plot_bgcolor: '#121212',
        margin: { l: 60, r: 30, t: 50, b: 50 },
        xaxis: {
          title: 'Entalpía Específica [kJ/kg]',
          gridcolor: '#2a2a2a',
          zerolinecolor: '#333',
          tickfont: { color: '#aaa' },
          titlefont: { color: '#aaa' }
        },
        yaxis: {
          title: 'Presión Absoluta [Bar]',
          type: 'log',
          gridcolor: '#2a2a2a',
          zerolinecolor: '#333',
          tickfont: { color: '#aaa' },
          titlefont: { color: '#aaa' }
        },
        legend: { font: { color: '#aaa' }, orientation: 'h', y: -0.15 }
      };

      const config = { responsive: true, displayModeBar: false };

      Plotly.newPlot('mollier-chart', [traceDomeLiq, traceDomeVap, traceCycle], layout, config);
    }

    // Dibujar el diagrama al cargar la página
    document.addEventListener('DOMContentLoaded', drawMollierChart);
  </script>
</body>
</html>
