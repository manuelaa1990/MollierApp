<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora HVAC</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.plotly.ly/plotly-2.27.0.min.js"></script>
</head>
<body>

  <div class="app-container">
    
    <!-- DATOS DE CAMPO -->
    <div class="card">
      <h2 class="card-title">DATOS DE CAMPO</h2>
      
      <!-- Fila Unificada: Refrigerante y Unidades -->
      <div class="row-top-config">
        <div class="input-group">
          <label for="refrigerante">Refrigerante</label>
          <select id="refrigerante">
            <option value="R-404A" selected>R-404A</option>
            <option value="R-134a">R-134a</option>
            <option value="R-410A">R-410A</option>
            <option value="R-22">R-22</option>
          </select>
        </div>

        <div class="input-group">
          <label for="u-presion">U. Presión</label>
          <select id="u-presion">
            <option value="PSI" selected>PSI</option>
            <option value="Bar">Bar</option>
            <option value="kPa">kPa</option>
          </select>
        </div>

        <div class="input-group">
          <label for="u-temp">U. Temp</label>
          <select id="u-temp">
            <option value="C" selected>°C</option>
            <option value="F">°F</option>
          </select>
        </div>
      </div>

      <!-- Resto de entradas de lectura -->
      <div class="grid-inputs">
        <div class="input-group">
          <label for="p-succion">P. Succión (<span class="unit-p">PSI</span>)</label>
          <input type="number" id="p-succion" value="51" step="any">
        </div>

        <div class="input-group">
          <label for="p-descarga">P. Descarga (<span class="unit-p">PSI</span>)</label>
          <input type="number" id="p-descarga" value="261" step="any">
        </div>

        <div class="input-group">
          <label for="t-tub-succ">T. Tubería Succ (<span class="unit-t">°C</span>)</label>
          <input type="number" id="t-tub-succ" value="10" step="any">
        </div>

        <div class="input-group">
          <label for="t-tub-liq">T. Tubería Liq (<span class="unit-t">°C</span>)</label>
          <input type="number" id="t-tub-liq" value="35" step="any">
        </div>

        <div class="input-group">
          <label for="t-desc-comp">T. Descarga Compresor (<span class="unit-t">°C</span>)</label>
          <input type="number" id="t-desc-comp" value="75" step="any">
        </div>

        <div class="input-group">
          <label for="voltaje">Voltaje (V)</label>
          <input type="number" id="voltaje" value="220" step="any">
        </div>

        <div class="input-group">
          <label for="amperaje">Amperaje (A)</label>
          <input type="number" id="amperaje" value="10.5" step="any">
        </div>
      </div>
    </div>

    <!-- INDICADORES CALCULADOS -->
    <div class="card">
      <h2 class="card-title">INDICADORES CALCULADOS</h2>
      <div class="grid-indicators">
        <div class="indicator-box accent-blue">
          <span class="ind-label">Recalentamiento</span>
          <span class="ind-value" id="res-recalentamiento">19.2 K</span>
        </div>

        <div class="indicator-box accent-green">
          <span class="ind-label">Subenfriamiento</span>
          <span class="ind-value" id="res-subenfriamiento">6.2 K</span>
        </div>

        <div class="indicator-box accent-blue">
          <span class="ind-label">Potencia Elect. (kW)</span>
          <span class="ind-value" id="res-potencia">2.08 kW</span>
        </div>

        <div class="indicator-box accent-purple">
          <span class="ind-label">Cap. Frigorífica (qn)</span>
          <span class="ind-value" id="res-cap-frig">160.8 kJ/kg</span>
        </div>

        <div class="indicator-box accent-purple">
          <span class="ind-label">Trabajo Compresor (w)</span>
          <span class="ind-value" id="res-trabajo-comp">9.2 kJ/kg</span>
        </div>

        <div class="indicator-box accent-pink">
          <span class="ind-label">COP Estimado</span>
          <span class="ind-value" id="res-cop">17.57</span>
        </div>
      </div>
    </div>

    <!-- DIAGRAMA MOLLIER -->
    <div class="card">
      <div class="chart-controls">
        <button id="btn-zoom" class="btn-secondary">🔍 Zoom Zona Activa: OFF</button>
        <button id="btn-download" class="btn-primary">📷 Descargar PNG</button>
      </div>
      <div id="mollier-chart"></div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
