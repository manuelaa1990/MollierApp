<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diagrama Mollier y Reporte Técnico - Refrigeración</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 20px;
      background-color: #f4f7f6;
      color: #333;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    h2, h3 { color: #1a365d; margin-top: 0; }
    .grid-inputs {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 15px;
    }
    label { font-weight: bold; font-size: 0.9em; display: block; margin-bottom: 5px; }
    input {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .btn {
      background-color: #2b6cb0;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      margin-right: 10px;
      margin-top: 10px;
    }
    .btn:hover { background-color: #2c5282; }
    .canvas-container {
      position: relative;
      background: #ffffff;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
    }
    #metaHeader {
      display: flex;
      justify-content: space-between;
      border-bottom: 2px solid #2b6cb0;
      padding-bottom: 10px;
      margin-bottom: 15px;
      font-size: 0.95em;
    }
    @media print {
      .no-print { display: none; }
      body { background: white; }
      .card { box-shadow: none; border: none; }
    }
  </style>
</head>
<body>

<div class="card no-print">
  <h2>Datos del Servicio y Parámetros del Ciclo</h2>
  <div class="grid-inputs">
    <div>
      <label for="technicianName">Nombre del Técnico:</label>
      <input type="text" id="technicianName" value="Manuel Arias" placeholder="Ej: Manuel Arias">
    </div>
    <div>
      <label for="equipmentName">Nombre del Equipo:</label>
      <input type="text" id="equipmentName" placeholder="Ej: Cava Cervecera 3HP / Daikin XL10">
    </div>
  </div>

  <h3>Puntos de Operación (Entalpía vs Presión)</h3>
  <div class="grid-inputs">
    <div>
      <label for="pLow">Presión Baja (bar):</label>
      <input type="number" id="pLow" value="2.5" step="0.1">
    </div>
    <div>
      <label for="pHigh">Presión Alta (bar):</label>
      <input type="number" id="pHigh" value="14.0" step="0.1">
    </div>
    <div>
      <label for="h1">Entalpía Succión h1 (kJ/kg):</label>
      <input type="number" id="h1" value="400">
    </div>
    <div>
      <label for="h2">Entalpía Descarga h2 (kJ/kg):</label>
      <input type="number" id="h2" value="435">
    </div>
    <div>
      <label for="h3">Entalpía Líquido h3 (kJ/kg):</label>
      <input type="number" id="h3" value="240">
    </div>
  </div>

  <button class="btn" onclick="updateChart()">Actualizar Gráfica</button>
  <button class="btn" onclick="downloadChart()">Descargar Imagen Gráfica</button>
  <button class="btn" onclick="printReport()">Imprimir / Guardar Reporte PDF</button>
</div>

<div class="card" id="reportArea">
  <!-- Encabezado con Técnico, Equipo, Fecha y Hora -->
  <div id="metaHeader">
    <div>
      <strong>Técnico:</strong> <span id="lblTechnician">-</span><br>
      <strong>Equipo:</strong> <span id="lblEquipment">-</span>
    </div>
    <div style="text-align: right;">
      <strong>Fecha:</strong> <span id="lblDate">-</span><br>
      <strong>Hora:</strong> <span id="lblTime">-</span>
    </div>
  </div>

  <h2 style="text-align: center; margin-bottom: 20px;">Diagrama de Mollier (P-h)</h2>

  <div class="canvas-container">
    <canvas id="mollierChart"></canvas>
  </div>
</div>

<script>
  let mollierChart;

  function getDateTimeStr() {
    const now = new Date();
    const dateStr = now.toLocaleDateString('es-ES', { year: 'numeric', month: '2-digit', day: '2-digit' });
    const timeStr = now.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    return { dateStr, timeStr };
  }

  function syncHeaderInfo() {
    const tech = document.getElementById('technicianName').value || 'N/A';
    const equip = document.getElementById('equipmentName').value || 'N/A';
    const { dateStr, timeStr } = getDateTimeStr();

    document.getElementById('lblTechnician').innerText = tech;
    document.getElementById('lblEquipment').innerText = equip;
    document.getElementById('lblDate').innerText = dateStr;
    document.getElementById('lblTime').innerText = timeStr;
  }

  function initChart() {
    const ctx = document.getElementById('mollierChart').getContext('2d');

    // Datos referenciales de la campana de saturación
    const saturationDome = [
      { x: 150, y: 1.0 }, { x: 180, y: 3.0 }, { x: 200, y: 7.0 }, { x: 230, y: 15.0 }, { x: 260, y: 25.0 },
      { x: 380, y: 25.0 }, { x: 395, y: 15.0 }, { x: 405, y: 7.0 }, { x: 412, y: 3.0 }, { x: 418, y: 1.0 }
    ];

    mollierChart = new Chart(ctx, {
      type: 'scatter',
      data: {
        datasets: [
          // Campana de saturación
          {
            label: 'Campana de Saturación',
            data: saturationDome,
            showLine: true,
            borderColor: '#a0aec0',
            borderDash: [5, 5],
            borderWidth: 1.5,
            pointRadius: 0,
            fill: false
          },
          // 1. Compresión (Rojo)
          {
            label: '1-2: Trabajo del Compresor (Compresión)',
            data: [],
            showLine: true,
            borderColor: '#e53e3e',
            backgroundColor: '#e53e3e',
            borderWidth: 3,
            pointRadius: 4
          },
          // 2. Condensación y Desrecalentamiento (Azul)
          {
            label: '2-3: Condensación (Rechazo de Calor)',
            data: [],
            showLine: true,
            borderColor: '#3182ce',
            backgroundColor: '#3182ce',
            borderWidth: 3,
            pointRadius: 4
          },
          // 3. Expansión Isoentálpica (Verde)
          {
            label: '3-4: Expansión (Válvula de Expansión)',
            data: [],
            showLine: true,
            borderColor: '#38a169',
            backgroundColor: '#38a169',
            borderWidth: 3,
            pointRadius: 4
          },
          // 4. Evaporación (Naranja)
          {
            label: '4-1: Evaporación (Absorción de Calor)',
            data: [],
            showLine: true,
            borderColor: '#dd6b20',
            backgroundColor: '#dd6b20',
            borderWidth: 3,
            pointRadius: 4
          },
          // Marcador de Flash Gas (Morado)
          {
            label: 'Punto 4: Flash Gas / Entrada Evaporador',
            data: [],
            showLine: false,
            borderColor: '#805ad5',
            backgroundColor: '#805ad5',
            pointRadius: 7,
            pointStyle: 'rectRot'
          }
        ]
      },
      options: {
        responsive: true,
        scales: {
          x: {
            type: 'linear',
            position: 'bottom',
            title: { display: true, text: 'Entalpía h (kJ/kg)', font: { weight: 'bold' } },
            min: 100,
            max: 500
          },
          y: {
            type: 'linear',
            title: { display: true, text: 'Presión P (bar)', font: { weight: 'bold' } },
            min: 0,
            max: 30
          }
        },
        plugins: {
          legend: {
            display: true,
            position: 'bottom',
            labels: { boxWidth: 15, padding: 12 }
          }
        }
      }
    });

    updateChart();
  }

  function updateChart() {
    syncHeaderInfo();

    const pLow = parseFloat(document.getElementById('pLow').value);
    const pHigh = parseFloat(document.getElementById('pHigh').value);
    const h1 = parseFloat(document.getElementById('h1').value);
    const h2 = parseFloat(document.getElementById('h2').value);
    const h3 = parseFloat(document.getElementById('h3').value);
    const h4 = h3; // Proceso isoentálpico en la expansión (h3 = h4)

    // Punto 1: Succión | Punto 2: Descarga
    mollierChart.data.datasets[1].data = [{ x: h1, y: pLow }, { x: h2, y: pHigh }];

    // Punto 2: Descarga | Punto 3: Entrada a la Válvula
    mollierChart.data.datasets[2].data = [{ x: h2, y: pHigh }, { x: h3, y: pHigh }];

    // Punto 3: Entrada Válvula | Punto 4: Salida Válvula
    mollierChart.data.datasets[3].data = [{ x: h3, y: pHigh }, { x: h4, y: pLow }];

    // Punto 4: Entrada Evaporador | Punto 1: Succión
    mollierChart.data.datasets[4].data = [{ x: h4, y: pLow }, { x: h1, y: pLow }];

    // Punto Flash Gas
    mollierChart.data.datasets[5].data = [{ x: h4, y: pLow }];

    mollierChart.update();
  }

  function downloadChart() {
    syncHeaderInfo();
    const tech = document.getElementById('lblTechnician').innerText;
    const date = document.getElementById('lblDate').innerText.replace(/\//g, '-');
    
    const link = document.createElement('a');
    link.download = `Mollier_${tech}_${date}.png`;
    link.href = mollierChart.toBase64Image();
    link.click();
  }

  function printReport() {
    syncHeaderInfo();
    window.print();
  }

  window.onload = initChart;
</script>

</body>
</html>
