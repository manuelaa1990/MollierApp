<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Diagramas de Mollier (p-h) Pro - Mediciones de Campo</title>
  
  <!-- CDN de Plotly.js -->
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100dvh;
      padding: 6px;
      gap: 6px;
    }

    /* --- PANEL SUPERIOR --- */
    .top-panel {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 6px;
      flex-shrink: 0;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 6px 10px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    .card h2 {
      font-size: 0.72rem;
      text-transform: uppercase;
      color: #38bdf8;
      margin-bottom: 4px;
      letter-spacing: 0.5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .config-row {
      display: flex;
      gap: 4px;
      margin-bottom: 4px;
      width: 100%;
    }

    .config-row .input-group-ref { flex: 2; min-width: 0; }
    .config-row .input-group-unit { flex: 1; min-width: 0; }

    .controls-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
    }

    .input-group label {
      font-size: 0.58rem;
      font-weight: 600;
      margin-bottom: 1px;
      color: #94a3b8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .input-group input, .input-group select {
      padding: 2px 4px;
      border: 1px solid #475569;
      border-radius: 4px;
      font-size: 0.72rem;
      outline: none;
      background-color: #0f172a;
      color: #f8fafc;
      width: 100%;
      height: 24px;
    }

    .input-group select {
      cursor: pointer;
      border-color: #38bdf8;
      font-weight: 600;
      text-overflow: ellipsis;
    }

    .input-group select optgroup {
      background-color: #1e293b;
      color: #38bdf8;
      font-style: normal;
      font-weight: bold;
    }

    .input-group select option {
      background-color: #0f172a;
      color: #f8fafc;
    }

    .input-group input:focus, .input-group select:focus {
      border-color: #38bdf8;
    }

    .action-bar {
      display: flex;
      gap: 6px;
      margin-bottom: 4px;
      width: 100%;
    }

    .btn {
      flex: 1;
      padding: 4px 8px;
      border: none;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      height: 26px;
    }

    .btn-primary { background-color: #0284c7; color: #ffffff; }
    .btn-primary:hover { background-color: #0369a1; }

    .btn-toggle { background-color: #334155; color: #cbd5e1; }
    .btn-toggle.active {
      background-color: #10b981;
      color: #ffffff;
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.4);
    }

    .results-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      height: calc(100% - 18px);
      align-content: center;
    }

    .kpi-box {
      background-color: #0f172a;
      border-left: 3px solid #38bdf8;
      padding: 3px 5px;
      border-radius: 4px;
    }

    .kpi-box .label {
      font-size: 0.55rem;
      color: #94a3b8;
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .kpi-box .value {
      font-size: 0.78rem;
      font-weight: 700;
      color: #f8fafc;
    }

    /* --- PANEL INFERIOR: GRÁFICA --- */
    .chart-card {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      position: relative;
      padding: 6px;
    }

    .chart-container {
      width: 100%;
      height: 100%;
      flex: 1;
      min-height: 0;
    }

    @media (max-width: 680px) {
      .app-container { padding: 4px; gap: 4px; }
      .top-panel { grid-template-columns: 1fr; }
      .input-group label { font-size: 0.54rem; }
      .input-group input, .input-group select { font-size: 0.68rem; }
      .results-grid { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <header class="top-panel">
      <div class="card">
        <h2><span>Datos de Campo</span></h2>
        
        <div class="config-row">
          <div class="input-group input-group-ref">
            <label for="refSelect">Refrigerante</label>
            <select id="refSelect" onchange="guardarYActualizar()">
              <optgroup label="Puros y Tradicionales">
                <option value="R134a">R-134a</option>
                <option value="R22">R-22</option>
                <option value="R410A">R-410A</option>
                <option value="R32">R-32</option>
              </optgroup>
              <optgroup label="Hidrocarburos (HC)">
                <option value="R290">R-290 (Propano)</option>
                <option value="R600a">R-600a (Isobutano)</option>
              </optgroup>
              <optgroup label="Mezclas HFC (Serie 400 / 500)">
                <option value="R404A" selected>R-404A</option>
                <option value="R507A">R-507A</option>
                <option value="R407C">R-407C</option>
                <option value="R407A">R-407A</option>
                <option value="R407F">R-407F</option>
                <option value="R417A">R-417A</option>
              </optgroup>
              <optgroup label="HFO Nueva Generación">
                <option value="R1234yf">R-1234yf</option>
              </optgroup>
            </select>
          </div>

          <div class="input-group input-group-unit">
            <label for="pUnitSelect">U. Presión</label>
            <select id="pUnitSelect" onchange="cambiarUnidades()">
              <option value="psi" selected>PSI</option>
              <option value="bar">Bar</option>
              <option value="kpa">kPa</option>
            </select>
          </div>

          <div class="input-group input-group-unit">
            <label for="tUnitSelect">U. Temp</label>
            <select id="tUnitSelect" onchange="cambiarUnidades()">
              <option value="C" selected>°C</option>
              <option value="F">°F</option>
            </select>
          </div>
        </div>

        <div class="controls-grid">
          <div class="input-group">
            <label for="pSuct" id="lblPSuct">P. Succión</label>
            <input type="number" id="pSuct" value="25" step="1" oninput="guardarYActualizar()">
          </div>

          <div class="input-group">
            <label for="pDesc" id="lblPDesc">P. Descarga</label>
            <input type="number" id="pDesc" value="290" step="1" oninput="guardarYActualizar()">
          </div>

          <div class="input-group">
            <label for="tSuct" id="lblTSuct">T. Tubería Succ</label>
            <input type="number" id="tSuct" value="-10" step="0.5" oninput="guardarYActualizar()">
          </div>

          <div class="input-group">
            <label for="tLiq" id="lblTLiq">T. Tubería Liq</label>
            <input type="number" id="tLiq" value="45" step="0.5" oninput="guardarYActualizar()">
          </div>

          <div class="input-group">
            <label for="tDescReal" id="lblTDescReal">T. Descarga</label>
            <input type="number" id="tDescReal" value="90" step="1" oninput="guardarYActualizar()">
          </div>

          <div class="input-group">
            <label for="vVolt">Voltaje (V)</label>
            <input type="number" id="vVolt" value="220" step="1" oninput="guardarYActualizar()">
          </div>

          <div class="input-group">
            <label for="iAmp">Amperaje (A)</label>
            <input type="number" id="iAmp" value="22" step="0.1" oninput="guardarYActualizar()">
          </div>
        </div>

      </div>

      <div class="card">
        <h2>Indicadores Calculados</h2>
        <div class="results-grid">
          <div class="kpi-box" style="border-left-color: #38bdf8;">
            <span class="label">Recalent.</span>
            <span class="value" id="kpiSH">0.0 K</span>
          </div>
          <div class="kpi-box" style="border-left-color: #10b981;">
            <span class="label">Subenfriam.</span>
            <span class="value" id="kpiSC">0.0 K</span>
          </div>
          <div class="kpi-box" style="border-left-color: #f59e0b;">
            <span class="label">Potencia Elec.</span>
            <span class="value" id="kpiKW">0.00 kW</span>
          </div>
          <div class="kpi-box" style="border-left-color: #a855f7;">
            <span class="label">Cap. Frig. (qn)</span>
            <span class="value" id="kpiqn">0 kJ/kg</span>
          </div>
          <div class="kpi-box" style="border-left-color: #ef4444;">
            <span class="label">Trabajo Comp (w)</span>
            <span class="value" id="kpiw">0 kJ/kg</span>
          </div>
          <div class="kpi-box" style="border-left-color: #ec4899;">
            <span class="label">COP Estimado</span>
            <span class="value" id="kpicop">0.0</span>
          </div>
        </div>
      </div>

    </header>

    <main class="card chart-card">
      <div class="action-bar">
        <button class="btn btn-toggle" id="btnZonaActiva" onclick="toggleZonaActiva()">
          🔍 Zoom Zona Activa: OFF
        </button>
        <button class="btn btn-primary" onclick="descargarGrafica()">
          📷 Descargar PNG
        </button>
      </div>

      <div id="mollierPlot" class="chart-container"></div>
    </main>

  </div>

  <script>

    let pUnitActual = 'psi';
    let tUnitActual = 'C';

    const pUnits = {

          {p: 15.0, hL: 270, hV: 522.0, tSat: 20}, {p: 30.0, hL: 335, hV: 515.0, tSat: 50},
          {p: 57.8, hL: 470, hV: 470, tSat: 78}
        ]
      },
      R290: {
        nombre: "R-290", criticalP: 42.5, xRange: [170, 640], pRange: [1.0, 45],
        dome: [
          {p: 1.0, hL: 200, hV: 568.0, tSat: -40}, {p: 3.0, hL: 250, hV: 578.0, tSat: -22},

      },
      R407A: {

        dome: [
          {p: 1.2, hL: 150, hV: 398.0, tSat: -35}, {p: 6.0, hL: 205, hV: 403.0, tSat: 3},

      },

      },

          {p: 5.0, hL: 212, hV: 381.0, tSat: 12},  {p: 10.0, hL: 245, hV: 385.0, tSat: 36},
          {p: 33.8, hL: 361, hV: 361, tSat: 94}

      }
    };

    function actualizarEtiquetas() {
      document.getElementById('lblPSuct').innerText = `P. Succión (${pUnits[pUnitActual].label})`;
      document.getElementById('lblPDesc').innerText = `P. Descarga (${pUnits[pUnitActual].label})`;
      document.getElementById('lblTSuct').innerText = `T. Succ (°${tUnitActual})`;
      document.getElementById('lblTLiq').innerText = `T. Liq (°${tUnitActual})`;
      document.getElementById('lblTDescReal').innerText = `T. Desc (°${tUnitActual})`;
    }

    function cambiarUnidades() {
      const nuevaPUnit = document.getElementById('pUnitSelect').value;
      const nuevaTUnit = document.getElementById('tUnitSelect').value;

      const pFactorViejo = pUnits[pUnitActual].factor;
      const pFactorNuevo = pUnits[nuevaPUnit].factor;

      ['pSuct', 'pDesc'].forEach(id => {
        const elem = document.getElementById(id);
        const valBar = parseFloat(elem.value) / pFactorViejo;
        elem.value = (valBar * pFactorNuevo).toFixed(nuevaPUnit === 'psi' ? 0 : 1);
      });

      if (tUnitActual !== nuevaTUnit) {
        ['tSuct', 'tLiq', 'tDescReal'].forEach(id => {
          const elem = document.getElementById(id);
          let val = parseFloat(elem.value);
          if (nuevaTUnit === 'F') {
            elem.value = (val * 9/5 + 32).toFixed(1);
          } else {
            elem.value = ((val - 32) * 5/9).toFixed(1);
          }
        });
      }

      pUnitActual = nuevaPUnit;
      tUnitActual = nuevaTUnit;

      actualizarEtiquetas();
      guardarYActualizar();
    }

    function toggleZonaActiva() {
      zonaActivaHabilitada = !zonaActivaHabilitada;
      actualizarEstadoBotonZoom();
      guardarYActualizar();
    }

    function actualizarEstadoBotonZoom() {
      const btn = document.getElementById('btnZonaActiva');
      btn.innerText = `🔍 Zoom Zona Activa: ${zonaActivaHabilitada ? 'ON' : 'OFF'}`;
      btn.classList.toggle('active', zonaActivaHabilitada);
    }

    function guardarConfiguracion() {
      const data = {
        refSelect: document.getElementById('refSelect').value,
        pUnitSelect: document.getElementById('pUnitSelect').value,
        tUnitSelect: document.getElementById('tUnitSelect').value,
        pSuct: document.getElementById('pSuct').value,
        pDesc: document.getElementById('pDesc').value,
        tSuct: document.getElementById('tSuct').value,
        tLiq: document.getElementById('tLiq').value,
        tDescReal: document.getElementById('tDescReal').value,
        vVolt: document.getElementById('vVolt').value,
        iAmp: document.getElementById('iAmp').value,
        zonaActivaHabilitada: zonaActivaHabilitada
      };
      localStorage.setItem('mollier_app_data', JSON.stringify(data));
    }

    function cargarConfiguracion() {
      const saved = localStorage.getItem('mollier_app_data');
      if (saved) {
        try {
          const data = JSON.parse(saved);
          if (data.refSelect) document.getElementById('refSelect').value = data.refSelect;
          if (data.pUnitSelect) document.getElementById('pUnitSelect').value = data.pUnitSelect;
          if (data.tUnitSelect) document.getElementById('tUnitSelect').value = data.tUnitSelect;
          if (data.pSuct !== undefined) document.getElementById('pSuct').value = data.pSuct;
          if (data.pDesc !== undefined) document.getElementById('pDesc').value = data.pDesc;
          if (data.tSuct !== undefined) document.getElementById('tSuct').value = data.tSuct;
          if (data.tLiq !== undefined) document.getElementById('tLiq').value = data.tLiq;
          if (data.tDescReal !== undefined) document.getElementById('tDescReal').value = data.tDescReal;
          if (data.vVolt !== undefined) document.getElementById('vVolt').value = data.vVolt;
          if (data.iAmp !== undefined) document.getElementById('iAmp').value = data.iAmp;
          if (data.zonaActivaHabilitada !== undefined) zonaActivaHabilitada = data.zonaActivaHabilitada;

          pUnitActual = document.getElementById('pUnitSelect').value;
          tUnitActual = document.getElementById('tUnitSelect').value;
          actualizarEstadoBotonZoom();
        } catch (e) {
          console.error("Error al cargar configuración", e);
        }
      }
    }

    function guardarYActualizar() {
      guardarConfiguracion();
      actualizarTodo();
    }

    function descargarGrafica() {
      const refKey = document.getElementById('refSelect').value;
      Plotly.downloadImage('mollierPlot', {
        format: 'png',
        width: 1200,
        height: 700,
        filename: `Mollier_Campo_${refKey}_${pUnitActual.toUpperCase()}`
      });
    }

    function getDomeTrace(refData) {
      const hVals = [];
      const pVals = [];
      const f = pUnits[pUnitActual].factor;

      refData.dome.forEach(pt => {
        hVals.push(pt.hL);
        pVals.push(pt.p * f);
      });

      for (let i = refData.dome.length - 1; i >= 0; i--) {
        hVals.push(refData.dome[i].hV);
        pVals.push(refData.dome[i].p * f);
      }

      return {
        x: hVals,
        y: pVals,
        mode: 'lines',
        name: `Domo ${refData.nombre}`,
        line: { color: '#38bdf8', width: 2.5, shape: 'spline', smoothing: 1.1 }
      };
    }

    function getPropAtP(refData, pBarAbs) {
      const dome = refData.dome;
      if (pBarAbs <= dome[0].p) return dome[0];
      if (pBarAbs >= refData.criticalP) return dome[dome.length - 1];

      for (let i = 0; i < dome.length - 1; i++) {
        if (pBarAbs >= dome[i].p && pBarAbs <= dome[i+1].p) {
          const factor = (pBarAbs - dome[i].p) / (dome[i+1].p - dome[i].p);
          return {
            hL: dome[i].hL + factor * (dome[i+1].hL - dome[i].hL),
            hV: dome[i].hV + factor * (dome[i+1].hV - dome[i].hV),
            tSat: dome[i].tSat + factor * (dome[i+1].tSat - dome[i].tSat)
          };
        }
      }
      return dome[0];
    }

    function actualizarTodo() {
      const refKey = document.getElementById('refSelect').value;
      const refData = refrigerantes[refKey];
      const pf = pUnits[pUnitActual].factor;

      let pSuctInput = parseFloat(document.getElementById('pSuct').value);
      let pDescInput = parseFloat(document.getElementById('pDesc').value);

      if (isNaN(pSuctInput)) pSuctInput = 25;
      if (isNaN(pDescInput)) pDescInput = 290;

      let pSuctBarRel = pSuctInput / pf;
      let pDescBarRel = pDescInput / pf;

      if (pSuctBarRel < 0.1) pSuctBarRel = 0.1;
      if (pDescBarRel <= pSuctBarRel) pDescBarRel = pSuctBarRel + 2.0;

      const pSuctBarAbs = pSuctBarRel + 1.013;
      const pDescBarAbs = Math.min(pDescBarRel + 1.013, refData.criticalP - 0.2);

      let tSuctVal = parseFloat(document.getElementById('tSuct').value) || -10;
      let tLiqVal = parseFloat(document.getElementById('tLiq').value) || 45;
      let tDescRealVal = parseFloat(document.getElementById('tDescReal').value) || 90;

      if (tUnitActual === 'F') {
        tSuctVal = (tSuctVal - 32) * 5/9;
        tLiqVal = (tLiqVal - 32) * 5/9;
        tDescRealVal = (tDescRealVal - 32) * 5/9;
      }

      const vVolt = parseFloat(document.getElementById('vVolt').value) || 220;
      const iAmp = parseFloat(document.getElementById('iAmp').value) || 0;
      const pKw = (vVolt * iAmp * 0.9) / 1000.0;

      const propEvap = getPropAtP(refData, pSuctBarAbs);
      const propCond = getPropAtP(refData, pDescBarAbs);

      const superHeatK = Math.max(tSuctVal - propEvap.tSat, 0);
      const subCoolK = Math.max(propCond.tSat - tLiqVal, 0);

      const h1 = propEvap.hV + (superHeatK * 1.25);
      const h2 = propCond.hV + Math.max(tDescRealVal - propCond.tSat, 5) * 1.35;
      const h3 = propCond.hL - (subCoolK * 1.25);
      const h4 = h3;

      const qn = h1 - h4;
      const w = h2 - h1;
      const cop = w > 0 ? (qn / w) : 0;

      document.getElementById('kpiSH').innerText = `${superHeatK.toFixed(1)} K`;
      document.getElementById('kpiSC').innerText = `${subCoolK.toFixed(1)} K`;
      document.getElementById('kpiKW').innerText = `${pKw.toFixed(2)} kW`;
      document.getElementById('kpiqn').innerText = `${qn.toFixed(1)} kJ/kg`;
      document.getElementById('kpiw').innerText = `${w.toFixed(1)} kJ/kg`;
      document.getElementById('kpicop').innerText = cop.toFixed(2);

      const pSuctPlot = pSuctBarAbs * pf;
      const pDescPlot = pDescBarAbs * pf;

      const cycleTrace = {
        x: [h1, h2, h3, h4, h1],
        y: [pSuctPlot, pDescPlot, pDescPlot, pSuctPlot, pSuctPlot],
        mode: 'lines+markers+text',
        name: 'Ciclo Operativo Real',
        text: ['1 (Succ)', '2 (Desc)', '3 (Liq)', '4 (Evap)', ''],
        textposition: ['bottom right', 'top right', 'top left', 'bottom left', ''],
        textfont: { color: '#f8fafc', size: 11 },
        line: { color: '#ef4444', width: 2.5 },
        marker: { size: 6, color: '#f59e0b' }
      };

      const traces = [getDomeTrace(refData), cycleTrace];

      traces.unshift({
        x: [h1, h2, h3, h4],
        y: [pSuctPlot, pDescPlot, pDescPlot, pSuctPlot],
        fill: 'toself',
        fillcolor: 'rgba(56, 189, 248, 0.15)',
        line: { color: 'transparent' },
        name: 'Zona Operativa',
        showlegend: false
      });

      let xRangeFinal, yRangeFinal;

      const maxH_Ciclo = Math.max(h1, h2, h3, h4);
      const minH_Ciclo = Math.min(h1, h2, h3, h4);

      if (zonaActivaHabilitada) {
        const hMargin = (maxH_Ciclo - minH_Ciclo) * 0.15;
        const minPLog = Math.log10(Math.min(pSuctPlot, pDescPlot)) - 0.08;
        const maxPLog = Math.log10(Math.max(pSuctPlot, pDescPlot)) + 0.08;

        xRangeFinal = [minH_Ciclo - hMargin, maxH_Ciclo + hMargin];
        yRangeFinal = [minPLog, maxPLog];
      } else {
        // AJUSTE CLAVE: Ajustar eje Y estrictamente alrededor del ciclo para evitar que la gráfica se estire verticalmente
        const pMinUtil = Math.max(pSuctPlot * 0.7, refData.dome[0].p * pf);
        const pMaxUtil = Math.min(pDescPlot * 1.35, refData.criticalP * pf);

        // Ajustar X ajustado al domo específico
        xRangeFinal = [refData.xRange[0], refData.xRange[1]];
        yRangeFinal = [
          Math.log10(pMinUtil),
          Math.log10(pMaxUtil)
        ];
      }

      const layout = {
        margin: { l: 15, r: 15, t: 30, b: 15 },
        autosize: true,
        paper_bgcolor: '#1e293b',
        plot_bgcolor: '#0f172a',
        dragmode: false,
        showlegend: false,
        title: {
          text: `Diagrama Mollier p-h (${refData.nombre})`,
          font: { color: '#f8fafc', size: 12 }
        },
        xaxis: {
          visible: true,
          showticklabels: false,
          showgrid: true,
          gridcolor: '#1e293b',
          range: xRangeFinal,
          fixedrange: true
        },
        yaxis: {
          visible: true,
          showticklabels: false,
          showgrid: true,
          gridcolor: '#1e293b',
          type: 'log',
          range: yRangeFinal,
          fixedrange: true
        }
      };

      const config = {
        responsive: true,
        displayModeBar: false,
        scrollZoom: false
      };

      Plotly.react('mollierPlot', traces, layout, config);
    }

    window.addEventListener('DOMContentLoaded', () => {
      cargarConfiguracion();
      actualizarEtiquetas();
      actualizarTodo();
    });

    window.addEventListener('resize', () => {
      Plotly.Plots.resize('mollierPlot');
    });
  </script>
</body>
</html>
