<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diagrama Mollier Responsive</title>
  <!-- Plotly.js CDN -->
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
  
  <style>
    :root {
      --bg-card: #0f172a;
      --bg-body: #020617;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border-color: #1e293b;
      --accent-blue: #38bdf8;
      --accent-orange: #fb923c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-body);
      color: var(--text-main);
      padding: 12px;
      max-width: 600px;
      margin: 0 auto;
    }

    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .card-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--accent-blue);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* CONTENEDOR DEL GRÁFICO RESPONSIVE */
    .chart-container {
      position: relative;
      width: 100%;
      /* 1:1 en teléfonos para dar espacio suficiente a la curva Mollier */
      aspect-ratio: 1 / 1; 
      min-height: 280px;
    }

    @media (min-width: 600px) {
      .chart-container {
        /* 16:9 en pantallas más anchas */
        aspect-ratio: 16 / 9; 
      }
    }

    #mollierChart {
      width: 100%;
      height: 100%;
    }

    /* GRID DE INDICADORES */
    .grid-indicadores {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .metric-card {
      background-color: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border-color);
      border-left: 3px solid var(--accent-blue);
      border-radius: 6px;
      padding: 8px 10px;
    }

    .metric-card.orange {
      border-left-color: var(--accent-orange);
    }

    .metric-label {
      font-size: 0.7rem;
      color: var(--text-sub);
      display: block;
      margin-bottom: 2px;
    }

    .metric-value {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-main);
    }
  </style>
</head>
<body>

  <!-- SECCIÓN GRÁFICA MOLLIER -->
  <div class="card">
    <div class="card-title">Diagrama Mollier p-h (R-404A) - Operación Real</div>
    <div class="chart-container">
      <div id="mollierChart"></div>
    </div>
  </div>

  <!-- SECCIÓN INDICADORES CALCULADOS -->
  <div class="card">
    <div class="card-title">Indicadores Calculados</div>
    <div class="grid-indicadores">
      <div class="metric-card">
        <span class="metric-label">Recalentamiento</span>
        <span class="metric-value">19.2 K</span>
      </div>
      <div class="metric-card orange">
        <span class="metric-label">Subenfriamiento</span>
        <span class="metric-value">6.2 K</span>
      </div>
      <div class="metric-card">
        <span class="metric-label">Potencia Elect. (kW)</span>
        <span class="metric-value">2.08 kW</span>
      </div>
      <div class="metric-card orange">
        <span class="metric-label">Cap. Frigorífica (qn)</span>
        <span class="metric-value">160.8 kJ/kg</span>
      </div>
      <div class="metric-card">
        <span class="metric-label">Trabajo Compresor (w)</span>
        <span class="metric-value">9.2 kJ/kg</span>
      </div>
      <div class="metric-card orange">
        <span class="metric-label">COP Estimado</span>
        <span class="metric-value">17.57</span>
      </div>
    </div>
  </div>

  <script>
    function renderMollierChart() {
      const isMobile = window.innerWidth < 480;

      // 1. Domo de saturación (Datos simulados R-404A)
      const domoH = [150, 200, 250, 300, 350, 370, 380, 370, 340, 280, 200, 150];
      const domoP = [15,  40,  90,  160, 250, 310, 340, 310, 250, 160, 90,  15];

      // 2. Ciclo de refrigeración real (1: Succ, 2: Desc, 3: Liq, 4: Evap)
      const cicloH = [385, 415, 240, 240, 385];
      const cicloP = [51,  261, 261, 51,  51];

      const data = [
        {
          x: domoH,
          y: domoP,
          type: 'scatter',
          mode: 'lines',
          name: 'Domo R-404A',
          line: { color: '#38bdf8', width: 2 }
        },
        {
          x: cicloH,
          y: cicloP,
          type: 'scatter',
          mode: 'lines+markers',
          name: 'Ciclo Operativo Real',
          line: { color: '#fb923c', width: 2 },
          marker: { size: isMobile ? 5 : 7, color: '#f97316' }
        }
      ];

      const layout = {
        paper_bgcolor: 'transparent',
        plot_bgcolor: 'transparent',
        margin: isMobile 
          ? { l: 35, r: 10, t: 10, b: 35 }  /* Márgenes compactos para móvil */
          : { l: 50, r: 20, t: 20, b: 45 },
        showlegend: true,
        legend: {
          orientation: 'h',
          x: 0,
          y: 1.15,
          font: { color: '#94a3b8', size: isMobile ? 9 : 11 }
        },
        xaxis: {
          title: { text: 'Entalpía h [kJ/kg]', font: { color: '#94a3b8', size: isMobile ? 10 : 12 } },
          tickfont: { color: '#64748b', size: isMobile ? 9 : 11 },
          gridcolor: '#1e293b',
          zerolinecolor: '#1e293b'
        },
        yaxis: {
          title: { text: 'Presión P_abs [PSI]', font: { color: '#94a3b8', size: isMobile ? 10 : 12 } },
          type: 'log', /* Escala logarítmica para presión típica en Mollier */
          tickfont: { color: '#64748b', size: isMobile ? 9 : 11 },
          gridcolor: '#1e293b',
          zerolinecolor: '#1e293b'
        }
      };

      const config = {
        responsive: true,
        displayModeBar: false // Oculta la barra de herramientas de Plotly para no saturar la pantalla
      };

      Plotly.newPlot('mollierChart', data, layout, config);
    }

    // Renderizado inicial
    renderMollierChart();

    // Redibujar de forma eficiente al cambiar el tamaño de la ventana
    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(renderMollierChart, 150);
    });
  </script>
</body>
</html>
